name: "Setup fragua"
description: "Download the fragua binary for the runner OS/arch and add it to PATH."

inputs:
  version:
    description: "fragua release tag to install (e.g. v0.1.0), or 'latest'."
    required: false
    default: "latest"
  token:
    description: "Token used to download the release asset. Defaults to the job token."
    required: false
    default: ${{ github.token }}
  web:
    description: "Install the full binary with the harness/serve web UI. Default false installs the smaller headless binary (fine for `fragua ci`)."
    required: false
    default: "false"

outputs:
  version:
    description: "The release tag that was installed."
    value: ${{ steps.install.outputs.version }}
  path:
    description: "Directory the fragua binary was installed into (added to PATH)."
    value: ${{ steps.install.outputs.path }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        # The repo this action was pulled from — that's where the binaries
        # live, regardless of the consumer repo `gh` would default to.
        FRAGUA_REPO: ${{ github.action_repository }}
        REQUESTED: ${{ inputs.version }}
        WEB: ${{ inputs.web }}
      run: |
        set -euo pipefail

        case "${{ runner.os }}-${{ runner.arch }}" in
          Linux-X64)    target=bun-linux-x64 ;;
          Linux-ARM64)  target=bun-linux-arm64 ;;
          macOS-ARM64)  target=bun-darwin-arm64 ;;
          macOS-X64)    target=bun-darwin-x64 ;;
          *) echo "::error::setup-fragua: unsupported runner ${{ runner.os }}/${{ runner.arch }}"; exit 1 ;;
        esac

        # Default to the smaller headless binary; `web: true` opts into the
        # full UI build. Asset names match release.yml.
        if [ "$WEB" = "true" ]; then asset="fragua-$target"; else asset="fragua-headless-$target"; fi

        tag="$REQUESTED"
        if [ "$tag" = "latest" ]; then
          tag=$(gh release view --repo "$FRAGUA_REPO" --json tagName -q .tagName)
        fi

        dir="$RUNNER_TEMP/fragua-bin"
        mkdir -p "$dir"

        # Download the chosen binary and the SHA256SUMS file together so we
        # can verify integrity before making the binary executable.
        gh release download "$tag" \
          --repo "$FRAGUA_REPO" \
          --pattern "$asset" \
          --pattern "SHA256SUMS" \
          --dir "$dir" \
          --clobber

        # Verify the downloaded binary against the checksum file.
        # Fail closed: missing entry or digest mismatch both exit 1.
        if ! grep -qF "$asset" "$dir/SHA256SUMS"; then
          echo "::error::setup-fragua: no checksum entry for $asset in SHA256SUMS"
          exit 1
        fi

        # sha256sum --check expects lines in the form "<digest>  <filename>".
        # Filter to only the line for this asset and run from the download dir
        # so the embedded filename resolves correctly.
        if ! (cd "$dir" && grep -F "$asset" SHA256SUMS | sha256sum --check --status); then
          echo "::error::setup-fragua: SHA256 mismatch for $asset — binary may have been tampered with"
          exit 1
        fi

        mv "$dir/$asset" "$dir/fragua"
        chmod +x "$dir/fragua"
        echo "$dir" >> "$GITHUB_PATH"

        echo "version=$tag" >> "$GITHUB_OUTPUT"
        echo "path=$dir" >> "$GITHUB_OUTPUT"
        echo "setup-fragua: installed $asset ($tag) → $dir (checksum verified)"

    - shell: bash
      run: fragua --version
