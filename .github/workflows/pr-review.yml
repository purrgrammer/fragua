name: PR review

# Unattended review on every push to a PR: installs the released fragua binary
# (setup-fragua) and runs the `pr_review` workflow (`.fragua/workflows/pr_review.yaml`)
# with `fragua ci`, posting the result back to the PR as a `comment` or
# `request-changes` review. Read-only: it runs LLM tool-calls over an untrusted
# diff, so it must NOT hold `contents: write` (prompt-injection surface).
#
# NO auto-merge. The review is a human-facing signal — a human merges. (A bot
# using GITHUB_TOKEN cannot post an APPROVED review state anyway, so there is no
# bot verdict that could safely gate a merge; CI remains the hard required gate.)
#
# The review pins a released fragua (setup-fragua@<tag>) for a reproducible
# review engine; `fragua ci --export` (shipped in 0.2.0) lands the run as a
# secret-free `.fragua` bundle. The engine is pinned, but the binary still reads
# THIS PR's `.fragua/workflows/pr_review.yaml` from the checkout, so workflow
# changes are still exercised. The trust boundary is unchanged: a same-repo PR
# already controls pr_review.yaml and this file, and fork PRs (no secrets) are
# skipped.

on:
  pull_request:
    types: [opened, reopened, synchronize]

# Read-only over the untrusted diff; the only write is posting the review back.
permissions:
  contents: read
  pull-requests: write # the review posts itself back to the PR

# A new commit on the PR cancels the review still running for the previous one
# — no point spending tokens reviewing a head SHA that's already been replaced.
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs don't receive secrets (no provider credential) and their
    # GITHUB_TOKEN is read-only (can't post), so the review can neither run nor
    # post — skip them. Same-repo PRs only.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so the review can diff against base

      - uses: purrgrammer/fragua/.github/actions/setup-fragua@v0.2.0

      - name: "Review PR #${{ github.event.pull_request.number }}"
        run: fragua ci pr_review --input pr=${{ github.event.pull_request.number }} --export "$RUNNER_TEMP/pr-review.fragua"
        env:
          # Swap for ANTHROPIC_OAUTH_TOKEN to draw on a Claude subscription
          # instead of API billing (setup-fragua/README.md § Credentials).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }} # gh pr diff / view / review

      # No manual scrubbing step: `fragua ci`'s CI profile scrubs the bundle at
      # export — it redacts provider-credential values + secret-named env vars
      # (DEPLOY_KEY, *_TOKEN, …) + known credential patterns from the events /
      # messages / artifacts, with generic `[REDACTED]` markers — and FAILS the
      # job (exit 80) if a live secret value reached the bundle path (the
      # perimeter-leak alarm). So the review step's exit code IS the fail-closed
      # gate, and the uploaded bundle is scrubbed regardless of outcome. This is
      # strictly stronger than the old single-key grep (all creds + env + patterns,
      # and it redacts rather than just detecting one literal).

      # Post-mortem locally: `fragua show <download>` to summarize, then
      # `fragua import <download>` + `fragua runs status|events|messages <run-id>`.
      - name: Upload run bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-review-bundle-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/pr-review.fragua
          if-no-files-found: warn
