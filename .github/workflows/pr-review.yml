name: PR review

# Unattended review on every push to a PR: installs the released fragua binary
# (setup-fragua) and runs the `pr_review` workflow (`.fragua/workflows/pr_review.yaml`)
# with `fragua ci`, posting the result back to the PR as a `comment` or
# `request-changes` review. Read-only: it runs LLM tool-calls over an untrusted
# diff, so it must NOT hold `contents: write` (prompt-injection surface).
#
# NO auto-merge. The review is a human-facing signal — a human merges. (A bot
# using GITHUB_TOKEN cannot post an APPROVED review state anyway, so there is no
# bot verdict that could safely gate a merge; CI remains the hard required gate.)
#
# The review pins a released fragua — the action by SHA, the binary by
# `with: version:` — for a reproducible review engine; `fragua ci --export`
# lands the run as a secret-free `.fragua` bundle. The engine is pinned, but the
# binary still reads the workflow file from THIS PR's checkout, so workflow
# changes are still exercised. That is also the failure mode to watch: a tree
# that uses a step type the PINNED release predates fails every PR. When
# `pr_review.yaml` gains a new step type, cut a release FIRST and bump both pins
# here — `pr-review-engine-pin.test.ts` fails the build if the two drift.
#
# ── Never stall ─────────────────────────────────────────────────────────────
#
# The run is wrapped in `timeout(1)`, and that wrapper — not the job timeout and
# not fragua's per-node `timeout-minutes` — is what guarantees this job
# terminates. Inside a fan-out a node timeout is an ABORT: the executor
# re-dispatches the branch with a fresh timer up to five times and then PAUSES
# the run, and a paused run in CI has no responder. `--signal=INT` sends SIGINT
# so `fragua ci`'s own shutdown path runs and its `finally` still writes the
# export bundle; `--kill-after` gives that 120s before SIGKILL. Previously the
# only watchdog was GitHub's external kill, which lands mid-syscall — the run
# that most needed a bundle produced zero artifacts.
#
# The job timeout is set ABOVE the wrapper on purpose: fragua must always win
# the race, so the external kill is a backstop rather than the mechanism.

on:
  pull_request:
    types: [opened, reopened, synchronize]

# Read-only over the untrusted diff; the only write is posting the review back.
permissions:
  contents: read
  pull-requests: write # the review posts itself back to the PR

# A new commit on the PR cancels the review still running for the previous one
# — no point spending tokens reviewing a head SHA that's already been replaced.
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs don't receive secrets (no provider credential) and their
    # GITHUB_TOKEN is read-only (can't post), so the review can neither run nor
    # post — skip them. Same-repo PRs only.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Backstop only — must stay ABOVE the `timeout` wrapper below plus its
    # --kill-after, so fragua's own shutdown always runs first.
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0 # full history so the review can diff against base

      - uses: purrgrammer/fragua/.github/actions/setup-fragua@0a27a9aeb83cb8778baa00b657d2e15f79a13148 # v0.11.0
        with:
          # The SHA pins the ACTION; this pins the BINARY. Without it the action
          # defaults to `version: latest` and resolves the newest release at run
          # time, so the "reproducible engine" above floats with every release.
          version: v0.11.0

      # `fragua ci` strips secret-named env (anything ending _TOKEN / _KEY / …) from
      # tool subprocesses, which removes GH_TOKEN from the `gh pr diff/view/review`
      # calls pr_review makes. `--allow-env GH_TOKEN` exempts it from the strip only —
      # the value is still a scrub needle, so it stays redacted from the exported
      # bundle.
      - name: "Review PR #${{ github.event.pull_request.number }}"
        id: review
        run: |
          timeout --signal=INT --kill-after=120s 30m \
            fragua ci pr_review \
              --input pr=${{ github.event.pull_request.number }} \
              --allow-env GH_TOKEN \
              --export "$RUNNER_TEMP/pr-review.fragua"
        env:
          # Swap for ANTHROPIC_OAUTH_TOKEN to draw on a Claude subscription
          # instead of API billing (setup-fragua/README.md § Credentials).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # The judge steps (scope / the per-lens judges) call TypeSafe's Jev;
          # without this the run halts at `scope` with "provider typesafe not
          # credentialed".
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          GH_TOKEN: ${{ github.token }} # exempted via --allow-env for gh; still a scrub needle

      # Last net. Every pause class (budget, goal gate, max retries, the fan-out
      # abort loop) is unreachable from inside the graph and exits non-zero
      # without posting, and so does the `timeout` wrapper. The run's own
      # `pr-review.md` lives in a worktree fragua disposes on the way out, so
      # this posts a pointer to the bundle rather than a body.
      #
      # `failure()` is load-bearing twice over: an `if:` with no status function
      # is implicitly `success() && …` (dead after a failed step), and gating on
      # `always()` would post on a concurrency cancellation — the routine case
      # where a newer commit superseded this review and a comment is noise.
      - name: Post fallback review
        if: failure() && steps.review.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body \
            "🤖 The fragua review did not complete (\`${{ github.job }}\` failed). The run bundle is attached to [this job](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}); inspect it with \`fragua show\` / \`fragua import\`."

      # No manual scrubbing step: `fragua ci`'s CI profile scrubs the bundle at
      # export — it redacts provider-credential values + secret-named env vars
      # (DEPLOY_KEY, *_TOKEN, …) + known credential patterns from the events /
      # messages / artifacts, with generic `[REDACTED]` markers — and FAILS the
      # job (exit 80) if a live secret value reached the bundle path (the
      # perimeter-leak alarm). So the review step's exit code IS the fail-closed
      # gate, and the uploaded bundle is scrubbed regardless of outcome.

      # Post-mortem locally: `fragua show <download>` to summarize, then
      # `fragua import <download>` + `fragua runs status|events|messages <run-id>`.
      #
      # `warn`, not `error`: a concurrency cancellation kills the job before the
      # export runs, and that is a routine, correct outcome — failing the upload
      # would turn every superseded review into a red check.
      - name: Upload run bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-review-bundle-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/pr-review.fragua
          if-no-files-found: warn
