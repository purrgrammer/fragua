name: PR review

# Unattended review on every push to a PR, in two jobs:
#   review    — builds fragua from THIS PR's checkout (bun) and runs the
#               `pr_review` workflow (`.fragua/workflows/pr_review.yaml`) with
#               `fragua ci`, posting the result back to the PR. Read-only: it runs
#               LLM tool-calls over an untrusted diff, so it must NOT hold
#               `contents: write` (prompt-injection surface).
#   automerge — a SEPARATE job (needs: review) that holds the write scope and,
#               on a clean review, arms GitHub auto-merge so the PR merges once
#               the required `ci` check passes. CI is the hard gate; the LLM
#               review is a soft pre-condition.
#
# The review runs fragua FROM SOURCE (not setup-fragua's released binary) so it
# exercises the code under review — and `fragua ci --export`, which lands the run
# as a secret-free `.fragua` bundle (the flag is newer than any release). The
# trust boundary is unchanged: a same-repo PR already controls pr_review.yaml and
# this file, and fork PRs (no secrets) are skipped.

on:
  pull_request:
    types: [opened, reopened, synchronize]

# Workflow default is read-only; only the automerge job opts up to write.
permissions:
  contents: read
  pull-requests: write # the review posts itself back to the PR

# A new commit on the PR cancels the review still running for the previous one
# — no point spending tokens reviewing a head SHA that's already been replaced.
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs don't receive secrets (no provider credential) and their
    # GITHUB_TOKEN is read-only (can't post), so the review can neither run nor
    # post — skip them. Same-repo PRs only.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so the review can diff against base

      # Build fragua from the PR's checkout (not setup-fragua's released binary)
      # so the review runs the code under review AND `fragua ci --export`. Mirror
      # ci.yml's bun setup.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.17"
      - run: bun install --frozen-lockfile

      - name: "Review PR #${{ github.event.pull_request.number }}"
        run: bun run fragua ci pr_review --input pr=${{ github.event.pull_request.number }} --export "$RUNNER_TEMP/pr-review.fragua"
        env:
          # Swap for ANTHROPIC_OAUTH_TOKEN to draw on a Claude subscription
          # instead of API billing (setup-fragua/README.md § Credentials).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }} # gh pr diff / view / review

      # The `.fragua` bundle is secret-free BY CONSTRUCTION — it never carries the
      # provider_credentials / provider_config tables (no scrub needed). Residual
      # guard: a tool that printed the key could have recorded it into an
      # event/message, which DOES travel — so FAIL CLOSED if the literal key
      # appears in the bundle bytes; delete it so the always() upload can't
      # publish a leak.
      - name: Verify bundle is secret-free (fail closed)
        if: always()
        env:
          BUNDLE: ${{ runner.temp }}/pr-review.fragua
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          [ -f "$BUNDLE" ] || { echo "no bundle at $BUNDLE — nothing to upload"; exit 0; }
          if [ -n "${ANTHROPIC_API_KEY:-}" ] && grep -qaF "$ANTHROPIC_API_KEY" "$BUNDLE"; then
            rm -f "$BUNDLE"
            echo "::error::provider key found in bundle bytes — a tool likely recorded it into events/messages"
            exit 1
          fi
          echo "bundle is secret-free → $BUNDLE"

      # Post-mortem locally: `fragua runs import <download> [--rehydrate]`, then
      # `fragua runs status|events|messages <run-id>`.
      - name: Upload run bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-review-bundle-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/pr-review.fragua
          if-no-files-found: warn

  automerge:
    needs: review # runs only after a SUCCESSFUL review (a halt never merges)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write # the merge itself — isolated from the LLM-executing job
      pull-requests: write
    steps:
      # Arm GitHub auto-merge only when fragua's own review came back clean.
      # Identity filter is the review-body shape (`# Code Review` / `LGTM:`),
      # not the `github-actions` login alone — that login is shared by every
      # Actions bot. On any non-clean (or no) verdict, disable a previously
      # armed auto-merge so a stale clean review from an earlier push can't
      # carry an arm forward (the cancel-in-progress race).
      - name: Arm/disarm auto-merge on the review verdict
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # this job has no checkout; tell gh the repo
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          state=$(gh pr view "$PR" --json reviews --jq '
            [.reviews[]
              | select(.author.login == "github-actions")
              | select((.body // "") | test("^(# Code Review|LGTM:)"))]
            | last | .state // "NONE"')
          echo "latest fragua review: $state"
          if [ "$state" = "COMMENTED" ]; then
            gh pr merge "$PR" --auto --squash \
              || echo "::warning::could not arm --squash auto-merge — needs repo 'Allow auto-merge' + squash-merge enabled + branch protection requiring the ci check"
          else
            gh pr merge "$PR" --disable-auto >/dev/null 2>&1 || true
            echo "review is $state — auto-merge not armed (any prior arm disabled)"
          fi
