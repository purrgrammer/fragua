name: Property tests (nightly)

# Seeded property runs go deeper than the per-PR CI — we crank numRuns up
# and iterate through fresh seeds so rare-branch coverage of the store /
# daemon invariants (OCC, sweep, HITL durability, abort loop) builds over
# time. Runs once a day; also available via workflow_dispatch for manual
# kicks.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  property:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.17"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Property suite — seed ${{ matrix.seed }}
        env:
          FAST_CHECK_NUM_RUNS: "500"
          FAST_CHECK_SEED: ${{ matrix.seed }}
        run: bun test ./packages/store ./packages/daemon ./packages/core
