name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history so the contract touch-gate can diff against the merge base

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.17"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # PBT depth ladder: 1× (baseline `bun run test` above) / 3× full suite +
      # 5× fault suites (this PR gate) / 20× (property-nightly.yml). Keeps
      # rare-branch fault-recovery regressions (OCC, sweep, HITL durability,
      # abort loop) from merging and only surfacing at night. The fault-injection
      # suites (executor-faults + abort-planner) carry a dedicated
      # FRAGUA_PBT_FAULT_RUNS multiplier so OCC-conflict / orphan-quarantine /
      # abort-ceiling get 5× depth here — their rare paths only surface deep —
      # while the rest of the node suite stays at 3× to keep PR wall-time bounded.
      # When FRAGUA_PBT_FAULT_RUNS is unset (nightly), the fault suites inherit
      # the global 20×. The 5× fault depth adds ~17s locally (full gate ~48s →
      # ~65s; the fault suites alone ~24s → ~38s) — keep it unsharded.
      - name: Property/fault-injection gate (FRAGUA_PBT_RUNS=3×, fault suites 5×, node suites only)
        env:
          FRAGUA_PBT_RUNS: "3"
          FRAGUA_PBT_FAULT_RUNS: "5"
        run: bun test --timeout 120000 ./packages/store ./packages/daemon ./packages/core ./packages/agent

      - name: Event-contract version touch-gate
        run: |
          base="${GITHUB_BASE_REF:-main}"
          git fetch --no-tags origin "$base"
          bash scripts/check-contract-bump.sh "origin/$base"

      - name: Verify pure core subtrees have no I/O imports
        run: |
          set -e
          banned='node:fs|node:child_process|node:net|node:http|node:https|node:dns|node:os|node:process'
          # Scope the purity check to the genuinely-pure subtrees.
          # packages/core/src/handler/context.ts legitimately persists via
          # @fragua/store; handlers themselves are separately enforced by
          # packages/core/test/handler/discipline.test.ts.
          hits=$(grep -rE "from [\"']($banned)" packages/core/src/parser packages/core/src/types packages/core/src/handler/types.ts packages/core/src/handler/intent-fold.ts packages/core/src/handler/handlers || true)
          if [ -n "$hits" ]; then
            echo "::error::pure core modules must not import I/O:"
            echo "$hits"
            exit 1
          fi
