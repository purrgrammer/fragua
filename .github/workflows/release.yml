name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write    # create the release + upload binary assets
  id-token: write    # needed by actions/attest-build-provenance to mint an OIDC token
  attestations: write # needed by actions/attest-build-provenance to write attestations

jobs:
  # Create (or reuse) the GitHub Release first so the matrix jobs below race
  # only on asset upload, never on release creation.
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      # Notes come from the matching CHANGELOG.md section (e.g. tag v0.2.0 →
      # the `## [0.2.0]` block), not auto-generated commit lists — the curated
      # entry is the release note. Fall back to --generate-notes if the version
      # has no section yet, so a tag never fails to publish on a missing block.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { inblock = 1; next }
            inblock && /^## \[/    { exit }
            inblock                { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            notes=(--notes-file release-notes.md)
          else
            notes=(--generate-notes)
          fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" \
                 --title "$GITHUB_REF_NAME" "${notes[@]}" --verify-tag

  binaries:
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Bun cross-compiles every target from one host, so all jobs run on
        # ubuntu. linux-x64 is what GitHub-hosted CI runners use; the rest
        # cover local dev. Asset name = `fragua-<target>`.
        target:
          - bun-linux-x64
          - bun-linux-arm64
          - bun-darwin-arm64
          - bun-darwin-x64
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.17"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Two assets per target: the canonical full binary (ships the web UI for
      # `harness`/`serve`) and a headless one (~20% smaller, no UI) that
      # `setup-fragua` installs by default for CI, where only `fragua ci` runs.
      - name: Compile binary (full)
        run: bun run build:bin --version "$GITHUB_REF_NAME" --target ${{ matrix.target }} --out dist/fragua-${{ matrix.target }}

      - name: Compile binary (headless)
        run: bun run build:bin --version "$GITHUB_REF_NAME" --no-web --target ${{ matrix.target }} --out dist/fragua-headless-${{ matrix.target }}

      # Smoke the assets that run natively on this host (the ubuntu runner is
      # linux-x64). Cross-compiled targets can't be executed here.
      - name: Smoke test
        if: matrix.target == 'bun-linux-x64'
        run: |
          ./dist/fragua-${{ matrix.target }} --version
          ./dist/fragua-headless-${{ matrix.target }} --version

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/fragua-${{ matrix.target }} \
            dist/fragua-headless-${{ matrix.target }} \
            --clobber

  # After all 8 binaries are uploaded: publish a single SHA256SUMS covering
  # every asset, then emit build provenance attestations via
  # actions/attest-build-provenance (Sigstore). Running in one job after the
  # matrix ensures a complete, authoritative checksum file rather than 4
  # partial ones racing to the release.
  checksums-and-attest:
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # SHA256SUMS is generated from the API's own per-asset `digest`, NOT by
      # downloading 775MB and hashing it. Two reasons, one of them load-bearing:
      # `gh release download` resolves the release through a projection that
      # lags the upload path by minutes, so this step reliably failed with "no
      # assets to download" seconds after four jobs had uploaded successfully —
      # and `setup-fragua` refuses to install without SHA256SUMS, so a release
      # would publish binaries nobody could install. The digests come from the
      # same API that stored the bytes; hashing them locally adds nothing.
      - name: Generate SHA256SUMS from the release API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .id)"
          mkdir -p dist
          gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" --paginate \
            --jq '.[] | select(.name != "SHA256SUMS") | "\(.digest | sub("^sha256:"; ""))  \(.name)"' \
            | sort -k2 > dist/SHA256SUMS
          test "$(wc -l < dist/SHA256SUMS)" -eq 8
          cat dist/SHA256SUMS

      - name: Upload SHA256SUMS to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            dist/SHA256SUMS \
            --clobber

      # Attestation DOES need the bytes, so it waits for the projection to
      # catch up rather than racing it. Bounded: ~5 minutes, then give up
      # loudly.
      - name: Download all release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            listed="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length' 2>/dev/null || echo 0)"
            [ "$listed" -ge 9 ] && break
            echo "release lists $listed assets; waiting for the projection (attempt $attempt/10)"
            sleep 30
          done
          for target in bun-linux-x64 bun-linux-arm64 bun-darwin-arm64 bun-darwin-x64; do
            gh release download "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "fragua-$target" \
              --pattern "fragua-headless-$target" \
              --dir dist \
              --clobber
          done

      # Emit a Sigstore build provenance attestation for every binary.
      # actions/attest-build-provenance links each file's digest to this
      # workflow run via OIDC, so consumers can verify the binary wasn't
      # tampered with after leaving GitHub Actions.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/fragua-bun-linux-x64
            dist/fragua-headless-bun-linux-x64
            dist/fragua-bun-linux-arm64
            dist/fragua-headless-bun-linux-arm64
            dist/fragua-bun-darwin-arm64
            dist/fragua-headless-bun-darwin-arm64
            dist/fragua-bun-darwin-x64
            dist/fragua-headless-bun-darwin-x64
