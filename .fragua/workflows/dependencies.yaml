# dependencies.yaml — survey outdated third-party deps, bump them, and keep the
# project green. Mirrors `work`: the change is made in the worktree and left
# UNCOMMITTED — green CI ends the run, the operator accepts (apply + commit) from
# the inbox, where the per-bump rationale lives in the run transcript.
#
# Shape:
#   update → changed? → lockfile_check → review → typecheck → ci → exit   (green ⇒ done, uncommitted)
#               ↓none         ↓fail       ↑retry            ↓fail   ↓fail
#              exit          update       update             fix ←───┘ → typecheck
#
# Principles:
#   - `update` touches MANIFESTS ONLY (package.json + lockfile). Adapting source
#     to a new API is the downstream `fix` step's job — keeps the bump diff
#     reviewable and the gate's job crisp.
#   - `review` is an independent judge — literally a `judge` step over the
#     manifest diff a tool step materialises (exact pins, scope respected, no
#     `workspace:` deps touched), never the author's reasoning; the lockfile
#     consistency check is the tool step itself (`bun install --frozen-lockfile`).
#     A failed gate is a goal-gate retarget back to `update`.
#   - `update` + `fix` share `thread: bump` so the fixer sees WHICH deps moved
#     and the stated breaking changes; the type/CI gates re-derive from the env.
#   - "Nothing in scope to update" is a graceful no-op → `exit`, not a halt —
#     this workflow is meant to be run on a cadence. Whether anything moved is
#     read off the worktree by the `changed` tool step (`git status`), never
#     reported by the model that did the work.
#
#   bun run fragua run dependencies
#   bun run fragua run dependencies --input scope=patch
#   bun run fragua run dependencies --input scope=major --input package=hono

name: dependencies
goal: Survey outdated third-party dependencies, bump their exact pins, and leave the project typecheck- and CI-green for the operator to accept.
budget: 6.00
budget-policy: pause

inputs:
  scope:
    type: choice
    options: [patch, minor, major]
    default: minor
    description: How aggressive the bumps may be (patch ⊂ minor ⊂ major)
  package:
    type: string
    default: ""
    description: Restrict to a single dependency; empty means every eligible dep

defaults:
  provider: anthropic
  model: claude-sonnet-4-6

steps:
  update:
    type: llm
    thread: bump
    allowed-tools: [read, grep, find, bash, edit]
    prompt: |
      Update fragua's third-party dependencies. Scope `${{ inputs.scope }}`: patch → patch bumps only; minor → patch + minor; major → include majors. Package filter `${{ inputs.package }}` — if non-empty, restrict to that one dependency; empty means every eligible dep.

      1. `bun outdated --filter='*'` to survey the WHOLE workspace (plain `bun outdated` only sees the root package). Every pin is exact, so the `Update` column mirrors `Current` — ignore it. Compare `Current` → `Latest`, classify each gap as patch/minor/major yourself, and keep only those within scope.
      2. For each in-scope dependency, bump its EXACT pin to `Latest` in the owning package.json — no `^` / `~` / ranges (AGENTS.md: every dep is an exact pin). The same dep may appear in several workspace packages; bump each. Skip `workspace:` protocol deps (internal `@fragua/*`).
      3. `bun install` to settle the lockfile.

      Manifests and lockfile only — do NOT edit source. Leave any compile/test breakage for the downstream steps.

      End with a SUMMARY block — one line per bump: `<pkg> <old>→<new> (patch|minor|major) — <one-line rationale>` — then the total count (`0 bumps` when nothing was in scope).
    next: changed

  changed:                             # did `update` move anything? exit 0 ⇒ yes → review; exit 1 ⇒ no → graceful exit
    type: tool
    run: test -n "$(git status --porcelain)"
    on:
      success: lockfile_check
      fail: exit

  lockfile_check:                      # (d) of the old review prompt is a command, so it is a tool step: a stale lockfile fails here
    type: tool
    run: |
      set -euo pipefail
      out=.fragua/scratch/deps
      rm -rf "$out" && mkdir -p "$out"
      git diff HEAD --stat > "$out/stat.txt"
      git diff HEAD -- '*package.json' '**/package.json' > "$out/manifests.diff"
      bun install --frozen-lockfile
    on:
      success: review
      fail: update                     # lockfile drifted from the manifests ⇒ back to update (capped by its max-retries)

  review:                              # (a)(b)(c) judged over the manifest diff — no repo reads needed, the diff is the evidence
    type: judge
    state:
      scope:     ${{ inputs.scope }}
      stat:      {file: .fragua/scratch/deps/stat.txt}
      manifests: {file: .fragua/scratch/deps/manifests.diff}
    questions:
      exact_pins:
        type: noul
        instructions: In `manifests`, is every changed dependency version an EXACT pin — no `^`, `~`, `>=`, `x`, or range anywhere on a changed line?
      scope_respected:
        type: noul
        instructions: Does every bump in `manifests` respect `scope` — patch means the major and minor parts are unchanged; minor means the major part is unchanged; major allows anything?
      manifests_only:
        type: noul
        instructions: Per `stat`, do the changes touch only package.json files and the lockfile (bun.lock) — no `workspace:` internal dependency altered in `manifests`, no source, test, or doc files changed?
      breaking_risk:
        type: score
        instructions: How likely is it that a bump in `manifests` carries a known breaking change a consumer must adapt to?
        criteria:
          - none — patch-level or clearly additive bumps only
          - possible — a minor bump on a library with a history of behavioural changes
          - likely — a major bump, or a bump across a documented breaking release
    decide:
      outcome: {questions: [exact_pins, scope_respected, manifests_only], min: 0.6}
    retry: update
    max-retries: 2
    next: typecheck

  typecheck:
    type: tool
    run: bun run typecheck
    max-retries: 3
    on:
      success: ci
      fail: fix

  ci:
    type: tool
    run: bun run ci
    max-retries: 5
    on:
      success: exit
      fail: fix

  fix:
    type: llm
    thread: bump
    max-cost: 0.40
    allowed-tools: [read, write, edit, grep, bash]
    prompt: |
      A dependency bump broke the build. Re-run the failing check (`bun run typecheck`, then `bun run ci`), read the failure, and make the MINIMAL source change to adapt to the new dependency APIs — the bumps in this thread tell you what moved.

      Never downgrade a pin, loosen it to a range, disable a test, lower an assertion, or relax a linter to make a check pass. If a bump can only be made to pass by reverting it, `abort` with `incompatible bump: <pkg> <reason>`. Stop once the check you ran is green.
    on:
      success: typecheck
      fail: exit
