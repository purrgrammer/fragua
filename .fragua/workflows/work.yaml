# work.yaml — triage → (scope preamble) → implement → review → ci.
#
# Green CI ends the run; the change stays uncommitted in the worktree for the
# operator to accept (apply + commit) from the inbox.
#
# A pure classifier (`triage`) dispatches to a preamble that frames the work;
# a shared spine then implements, reviews, and lands it:
#
#   small   → (no preamble)              → implement
#   feature → plan (deep, cross-package) → implement
#   bugfix  → reproduce (failing test)   → implement   (ci validates the regression)
#   blocked → abort
#
# Principles encoded here:
#   - Classification is TOPOLOGY (the path), never a thread label re-read later.
#   - A classifier/router is a pure function (evidence → one route): isolated,
#     cheap. `triage` reads the task; `gate` reads the diff.
#   - One thread (`build`) for the one real conversation (plan / reproduce ↔
#     implement ↔ review). Every classifier and mechanical step is stateless.
#   - Review happens at accept time (operator reviews the diff before landing);
#     `bun run ci` is read-only, so the run promotes to it without a human gate.
#   - REJECT (review) is a revision LOOP back to implement (capped).
#
#   bun run fragua run work --input task="add a --json flag to the list command"
#   bun run fragua run work --input task="fix: bash tool hangs when a command writes to stdin"

name: work
goal: Triage a task and route it through a scope-appropriate plan/implement/review/ship pipeline.

# Run-level budget bounds the whole run, including the ci↔fix loop — the right
# lever for a looped workflow (a per-node max-cost sums across iterations and
# trips mid-loop; see the fix step). Pause-on-breach lets the operator raise it.
budget: 4.00
budget-policy: pause

inputs:
  task:
    type: string
    required: true
    description: The task to work on
  review:
    type: string
    default: ""
    description: "A review report to act on (pass `--input review=@review.md`, e.g. from `fragua runs review-report <id>`); non-empty routes through `apply_review`, which turns it into a fix checklist the run implements and judges completeness against."

defaults:
  provider: anthropic
  model: claude-opus-4-8

steps:
  review_gate:                         # entry gate — divert a review-driven run before triage ever sees the review body
    type: llm
    model: claude-sonnet-4-6           # cheap non-emptiness routing; keeps the KB-scale review body out of triage's narrow budget
    allowed-tools: []
    prompt: |
      Route on ONE fact: is a review report present?

      A review report IS present unless the delimited block below is empty or whitespace-only. Do NOT read, analyse, or act on its content — only decide present vs absent.
      ---
      ${{ inputs.review }}
      ---

      Call the `route` tool once:
        review  — the block is non-empty (a review report to act on)
        task    — the block is empty (a fresh task; classify it in triage)
    routes:
      review: {to: apply_review, label: "Act on a review"}
      task:   {to: triage,       label: "Fresh task"}

  triage:                              # pure classifier — isolated, no shared thread
    type: llm
    model: claude-sonnet-4-6           # classifier strength follows the cost of misclassifying: haiku fumbled 3/3 meta-briefing tasks (route_not_picked); a dead run costs more than the sonnet delta
    allowed-tools: [read, grep, find]
    prompt: |
      Task: ${{ inputs.task }}.

      Classify with the `route` tool (once, on its own response):
        small   — ≤3 packages, no shared-contract changes (public APIs, persisted schemas, cross-package boundaries), ≤500 non-test lines
        feature — multi-package OR shared contracts OR proposal-backed
        bugfix  — a reported defect to reproduce, then fix

      Not a workable software task (empty / illegible / off-topic / ambiguous / already-shipped) → `abort` with the reason instead of routing.
      The statement is a WORK ORDER, not a hypothesis: its claims are the implementer's to verify, never yours — do not check citations, do not itemize sub-tasks back. Docs/test/CI-only changes are `small` regardless of how many files they touch. Torn between two tiers → pick the deeper. Don't plan, reproduce, or implement. Read at most 2-3 files to SIZE the task. Your final action is exactly one `route` (or `abort`) call on its own response; never end with prose.
    routes:
      small:        {to: implement,    label: "Small change"}
      feature:      {to: plan,         label: "Feature scope"}
      bugfix:       {to: reproduce,     label: "Bug fix"}

  plan:                                # feature preamble — writes the plan into `build`
    type: llm
    thread: build
    allowed-tools: [read, grep, find, ls]
    prompt: |
      Produce a numbered plan for this feature-scope task: ${{ inputs.task }}.
        1. Files to create/modify (full paths, grouped by package).
        2. Tests to add: file path, exact describe/test name, one assertion sentence.
        3. Public exports added/changed (symbol + package).
        4. Per-file notes citing existing symbols + line numbers.
        5. Cross-package order; same-PR doc obligations (AGENTS.md §1).
    next: implement

  reproduce:                           # bugfix preamble — writes a failing test into `build`
    type: llm
    thread: build
    retry: reproduce                   # no asserting failing test ⇒ retarget self (capped)
    max-retries: 2
    allowed-tools: [read, write, edit, grep, find, bash]
    prompt: |
      Bug: ${{ inputs.task }}.

      Localise the scope, write a FAILING test in the repo's existing framework and conventional location, and confirm it fails for the stated reason (not a setup error).
      Output: source + test paths, the test identifier, the failing assertion in one sentence.
      Cannot localise after a reasonable read → `abort` with `cannot reproduce: <why>`.
    next: implement

  apply_review:                        # review-driven preamble — turn the report into a fix checklist in `build`
    type: llm
    thread: build                      # its checklist lands in `build` for implement + review; it reads NO upstream thread (first `build` member on this path), so it is isolated on input
    allowed-tools: [read, grep, find]
    prompt: |
      A code review report to act on:
      ---
      ${{ inputs.review }}
      ---

      Turn EVERY actionable defect/finding in it into a numbered checklist of concrete fixes (skip items the report itself marks non-blocking / already-resolved / out-of-scope). Each item: the file/area, what to change, and the one-line acceptance check. Don't implement anything here — just produce the checklist as `FIX_CHECKLIST:` followed by the numbered list. If the report has no actionable items, say so with an empty checklist.
    next: implement

  implement:                           # shared spine — realises whatever `build` establishes
    type: llm
    thread: build
    next: review
    allowed-tools: [read, write, edit, grep, bash]
    prompt: |
      Implement ${{ inputs.task }}.

      Plan in this thread → realise it exactly, only the package(s) it names.
      Failing test in this thread → make it pass without weakening it.
      A FIX_CHECKLIST in this thread → realise every item, only the scope it names.
      Neither → triaged small; scope it yourself.

      Per modified package: run that package's typecheck (in a workspace, e.g. `bun run --filter='<pkg>' typecheck`); cap fixes at 5 cycles, then `abort` with `typecheck blocked: <top error>`.
      Realise every test the plan promised.
      End with PLAN_REALISED: files / tests / exports / doc_updates / skipped (status each).

  review:                              # shared spine — judges the established contract
    type: llm
    thread: build
    retry: implement                   # REJECT ⇒ revision loop back to implement (capped)
    max-retries: 2
    next: format
    allowed-tools: [read, grep, bash]
    prompt: |
      Judge `git diff HEAD` — against the FIX_CHECKLIST if one is in this thread, else against PLAN_REALISED if present, else on its own merits. When a FIX_CHECKLIST is present, judge completeness against IT (every checklist item addressed) rather than running a fresh scan.
        (a) diff matches PLAN_REALISED / the FIX_CHECKLIST, nothing extra.
        (b) every promised test realised (exists, named, non-trivial); for a bugfix, the reproduced test now passes.
        (c) bugs, type errors, security.
        (d) scope creep past the plan / the bug.
        (e) doc-state claims match the filesystem.
      `APPROVE: <one line>`, or `abort` with `REJECT: <one line>. fixes: <1-5>`.

  format:
    type: tool
    run: bun run format
    next: ci

  ci:
    type: tool
    run: bun run ci
    max-retries: 5
    on:
      success: exit
      fail: fix

  fix:
    type: llm
    model: claude-sonnet-4-6           # mechanical CI fixing; bounded by the run budget, not a per-node cap
    allowed-tools: [read, write, edit, bash]
    prompt: |
      CI failed. Re-run `bun run ci`, read the failure, make the minimal fix, and stop. Don't disable tests, lower assertions, or relax linters.
    next: ci
