# review.yaml — scope-and-classify → review scaled to the change → signoff → act.
#
# Symmetric with `work`: a cheap classifier sizes the change and routes to a
# tier-appropriate pipeline — minimum work for trivial diffs, full multi-lens
# rigor where it matters. The tier is classified from the DIFF (fresh
# evidence), never inherited from how the change was authored.
#
#   skip  → no review pass (doc/typo/whitespace/generated) — scope LGTMs
#   quick → one focused pass (small, single-concern change); no gate
#   full  → one deep pass applying the implicated lenses → verify gate
#
# All three tiers converge at the `signoff` HITL, where the operator decides
# the PR action — approve, post the review as feedback (request-changes if it
# has blocking findings, else a comment), or keep it local. The classifier only
# ever decides review *depth*; the human always authorizes the *action* — no
# path mutates the PR without a human. Each PR action consumes the review body
# + PR# from the thread.
#
# Two decisions: DEPTH is topology (skip/quick/full); within `full`, the LENS
# SET is the review step's own call — correctness always, security /
# performance / architecture only when the diff implicates them.
#
# PRECONDITION for PR / branch inputs: clean working tree. `scope` checks out
# the PR/branch so lenses read files on disk; `git checkout -` to return.
#
# Input forms (the `target` input, resolved by `scope`):
#   - empty                 → uncommitted changes (`git diff HEAD`)
#   - "<commitish>"         → e.g. "HEAD~3..HEAD", a sha
#   - "<path-or-glob>"      → e.g. "packages/server/src"
#   - "PR <n>" / "<branch>" → checks out, diff vs base
#   - any of the above + a free-text focus hint
#
#   bun run fragua run review
#   bun run fragua run review --input target="PR 128 focus on token storage"

name: review
goal: Code review scaled to the change — minimum work for trivial diffs, full multi-lens rigor where it matters.
budget: 2.50

inputs:
  target:
    type: string
    default: ""
    description: PR number, branch, path, commitish, or free-form hint

defaults:
  provider: anthropic
  model: claude-sonnet-4-6

steps:
  scope:                               # resolve target + checkout + classify tier; routes
    type: llm
    thread: review
    allowed-tools: [read, grep, find, bash]
    max-cost: 0.40
    prompt: |
      Resolve the review target from `${{ inputs.target }}`, prep the tree, then size the change and route.

      Resolve & prep:
        Classify the target: DIFF <base>..<head> | FILES <paths> | UNCOMMITTED. Defaults: empty→UNCOMMITTED, ref/range/sha→DIFF, path/glob→FILES, 'PR <n>'/branch→DIFF (with checkout).
        PR/branch: if `git status --porcelain` is non-empty, `abort` with `working tree dirty`. Then `gh pr checkout <n>` (or `git fetch origin <branch> && git checkout <branch>`); resolve base via `gh pr view --json baseRefName` or `git merge-base HEAD origin/main`. Commit ranges: don't switch branches.
        Empty target → `abort` with `nothing to review`.

      Emit (no preamble, ≤8 lines):
        TARGET: <DIFF|FILES|UNCOMMITTED> <args>
        PR: <number, or 'none'>
        PATHS: <comma-sep, real on-disk, repo-relative>
        LOC: <approx>
        FOCUS: <hint or general>
        CHECKOUT: <branch switched to, or 'unchanged'>

      Then size the change and call the `route` tool once (state the deciding factor in one line first):
        skip  — doc-only / typo / whitespace / comments / generated / version-bump; no semantic code change
        quick — small, single-concern change (a contained fix or minor change)
        full  — feature-scale, cross-cutting, or risk-bearing (auth / input parsing / data layer / shared contracts / large diff)

      For `skip`, that one line is the whole review — make it a clean `LGTM: <reason>`.
    routes:
      skip:  {to: signoff,      label: "Trivial"}
      quick: {to: review_quick, label: "Quick review"}
      full:  {to: review_full,  label: "Full review"}

  review_quick:                        # quick tier — one focused pass
    type: llm
    thread: review
    allowed-tools: [read, grep, bash]
    max-cost: 0.40
    next: signoff
    prompt: |
      Quick review of the scoped change (PATHS / range above; read the files directly). One focused pass over correctness and any obvious security or clarity issue — it's a small change, keep it to a single pass. Emit verbatim:

      # Code Review

      ## Findings
      One per line: `- [critical|high|medium|low] path:line — claim.` with `Why:` and `Fix:` each one sentence. If none, replace with `## All clear` + one sentence (what was reviewed, what you couldn't see).

      ## Next steps
      ≤2 concrete actions, or `No follow-up required.`

  review_full:                         # full tier — one deep pass over the implicated lenses
    type: llm
    model: claude-opus-4-7
    effort: high
    thread: review
    allowed-tools: [read, grep, bash]
    max-cost: 1.80
    next: verify
    prompt: |
      Deep review of the scoped change (PATHS / range / FOCUS above; read the files directly). Apply these lenses — correctness ALWAYS; add the others only when the diff implicates them, and say which you applied:

        correctness — logic bugs, off-by-one, races, missing null checks, broken invariants, mishandled errors/promises, type unsoundness, dead branches, edge cases. Cross-check call sites where it matters.
        security (iff trust boundaries / auth / input parsing / crypto / secrets touched) — injection (SQL/shell/XSS/path traversal), unvalidated input across trust boundaries, auth/authz gaps, secret leaks, unsafe deserialisation, weak crypto, SSRF; check surrounding sanitisation before flagging.
        performance (iff hot paths / data layer / loops / large payloads touched) — complexity surprises (O(n²) on a hot path), N+1, unbounded work, blocking I/O on hot paths, oversized payloads; confidence ∝ evidence; no cold-path constant-factor nits.
        architecture (iff cross-package coupling / public surface / abstraction boundaries change) — coupling crossing boundaries, leaky abstractions, SRP violations, drift-inviting duplication, misleading naming, public surface exposing internals, half-finished work, scope creep.

      Then emit one ranked review verbatim. Headings exactly: `# Code Review` / `## Scope` / `## Critical` / `## High` / `## Medium` / `## Low`.

      ## Scope: one paragraph naming the touched packages/areas and the change type (uncommitted diff, commit range, branch); note CHECKOUT if set; name which lenses you applied and why.

      Per finding: **path:line** — one-line claim. `Why:` one sentence. `Fix:` one sentence or short snippet. `Lens:` which lens flagged it.

      Rules: NO INVENTION. DROP subjective low findings with no evidence. A concern flagged under two lenses is ONE entry at the higher severity, noted `(cross-flagged)`.

      If everything is clean, replace the severity sections with `## All clear` (one paragraph: what was reviewed, what you couldn't see, confidence).

      End with `## Next steps` — ≤3 ordered actions, or `No follow-up required.`

  verify:                              # full tier — automated evidence-quality gate
    type: llm
    thread: review
    retry: review_full                 # REJECT ⇒ re-review (capped)
    max-retries: 2
    allowed-tools: [read, grep]
    max-cost: 0.30
    next: signoff
    prompt: |
      Evidence-quality gate for the review. Judge on its own merits.
        1. Every finding's path:line is verifiable — spot-check 2-3 by reading the cited path.
        2. Severity calibration sane (no low for misleading claims, no critical for nitpicks; cross-flagged ≥ high).
        3. Schema followed — Scope present; severities ordered or replaced by All clear; Next steps present.
      All pass → reply EXACTLY `APPROVE`. Else `abort` with `REJECT: <one-line worst violation>`.

  signoff:                             # human gate after quick + full (skip bypasses it)
    type: human
    text: "Review ready above. Approve the PR, post it as feedback, or keep it local?"
    routes:
      approve:  {to: pr_approve,  label: "Approve PR"}
      feedback: {to: pr_feedback, label: "Post feedback"}
      accept:   {to: exit,        label: "Keep local"}

  pr_approve:                          # post the review + APPROVE the PR
    type: llm
    thread: review
    allowed-tools: [bash]
    max-cost: 0.15
    next: exit
    prompt: |
      The PR number (PR: <n>) and the review are above in this thread.
      If PR is `none` (local diff, no PR), emit `LGTM (no PR to approve)` and stop — don't post.
      Otherwise write the review body to a temp file (heredoc), `gh pr review <PR> --approve --body-file <tmp>`, and emit `APPROVED: PR <n> <url>`.

  pr_feedback:                         # post the review; request-changes if blocking, else comment
    type: llm
    thread: review
    allowed-tools: [bash]
    max-cost: 0.15
    next: exit
    prompt: |
      The PR number (PR: <n>) and the review are above in this thread.
      If PR is `none`, emit `feedback kept local (no PR)` and stop.
      Otherwise write the review body to a temp file (heredoc). If the review has any Critical or High finding, `gh pr review <PR> --request-changes --body-file <tmp>`; otherwise `gh pr review <PR> --comment --body-file <tmp>`. Emit `POSTED: PR <n> <changes|comment> <url>`.
