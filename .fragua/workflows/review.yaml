# review.yaml — resolve → classify → review scaled to the change → signoff → act.
#
# A PIPELINE, not a conversation: there is NO shared `thread:`. Every step runs
# on FRESH, FOCUSED context — it consumes exactly the typed `outputs:` it needs
# and nothing else. `resolve` emits the review context; `classify` routes by
# depth; six parallel LENSES each run a recall-biased scan → an adversarial
# verify (hallucination filter); `synthesize` reconciles the verified results
# and WRITES the review to `review.md` (prose travels through a file, not a
# thread); `verify` gates that file. All tiers converge at the `signoff` HITL.
#
# Depth is topology: classify → skip / quick / full.
#   skip  → classify writes an LGTM to review.md; straight to signoff
#   quick → one focused pass (writes review.md); no gate
#   full  → prep_diff → a parallel fan-out of SIX lens branches, each a
#           two-node scan→verify sub-pipeline — defects (correctness,
#           integration, security, performance) AND improvements (quality:
#           reuse/simplification/altitude; coherence: tests/docs/conventions).
#           A review is holistic: a change can be bug-free and still wrong —
#           duplicated against an existing helper, fixed at the wrong depth,
#           or shipped without the test that pins it.
#
# Division of labor per lens: the SCAN is recall-biased (pass through
# half-believed candidates that have a nameable failure scenario or cost; the
# gate prunes), the VERIFY is precision-biased (drop only what is
# constructibly refutable — cite the line, the invariant, or the in-diff
# guard). Calibrated skepticism beats timid scanning.
#
# Model/effort strategy — strength follows the cost of being wrong, not a
# uniform default:
#   resolve/classify   sonnet, low effort  — cheap plumbing, but a bad
#                                            diff_spec or a `skip` misroute
#                                            forfeits the whole run (not haiku)
#   deep scans         sonnet, high effort — correctness / integration /
#                                            quality: recall-critical reading
#   surface scans      sonnet, medium      — security / performance: empty
#                                            unless the diff has the surface
#   coherence scan     sonnet, low         — mechanical cross-checks
#   verifies           sonnet, medium      — judgment, not search
#   synthesize         OPUS, high          — the one highest-leverage call:
#                                            cross-lens dedup + calibration +
#                                            the prose the human reads
#   verify gate        sonnet, low         — a sloppy REJECT re-runs opus
#   pr actions         haiku               — verbatim prescribed gh commands
#
# PRECONDITION for PR / branch inputs: clean working tree. `resolve` checks out
# the PR/branch so lenses read files on disk.
#
# Input forms (the `target` input, resolved by `resolve`):
#   - empty                 → uncommitted changes (`git diff HEAD`)
#   - "<commitish>"         → e.g. "HEAD~3..HEAD", a sha
#   - "<path-or-glob>"      → e.g. "packages/server/src"
#   - "PR <n>" / "<branch>" → checks out, diff vs base
#   - any of the above + a free-text focus hint
#
#   bun run fragua run review
#   bun run fragua run review --input target="PR 128 focus on token storage"

name: review
goal: Holistic code review scaled to the change — minimum work for trivial diffs; six concurrent lenses (defects AND design debt) where it matters.
# Single governor: the run-level budget. No per-step max-cost caps — a per-node
# cap sums across the node's iterations (a verify↔synthesize retarget re-runs
# synthesize) and a lens reading a real diff can need more than a tight cap.
# Budget-policy pause (default) lets the operator raise it mid-run.
budget: 12.00

inputs:
  target:
    type: string
    default: ""
    description: PR number, branch, path, commitish, or free-form hint

defaults:
  provider: anthropic
  model: claude-sonnet-4-6

steps:
  resolve:                             # resolve target + checkout; emit the review context as typed outputs
    type: llm
    effort: low
    allowed-tools: [read, grep, find, bash]
    next: classify
    outputs:
      pr:        { type: string }      # PR number, or "none"
      diff_spec: { type: string }      # exact `git diff` argument (e.g. "origin/main..HEAD", "HEAD"); "" ⇒ review PATHS directly
      paths:                           # real on-disk, repo-relative paths actually touched
        type: array
        items: { type: string }
      focus:     { type: string }      # focus hint, or "general"
    prompt: |
      Resolve the review target from `${{ inputs.target }}` and prep the tree, then emit the review context for the downstream steps (which run on fresh context and have ONLY what you emit).

      Classify the target: DIFF <base>..<head> | FILES <paths> | UNCOMMITTED. Defaults: empty→UNCOMMITTED, ref/range/sha→DIFF, path/glob→FILES, 'PR <n>'/branch→DIFF (with checkout).
        PR/branch: if `git status --porcelain` is non-empty, `abort` with `working tree dirty`. Then `gh pr checkout <n>` (or `git fetch origin <branch> && git checkout <branch>`); resolve base via `gh pr view --json baseRefName` or `git merge-base HEAD origin/main`. Commit ranges: don't switch branches.
        Empty target → `abort` with `nothing to review`.

      Review context for downstream steps:
        pr        — the PR number, or "none" for a local diff with no PR.
        diff_spec — the exact argument to `git diff` that shows the change (e.g. "origin/main..HEAD", or "HEAD" for uncommitted). Use "" only for FILES mode (review the paths as-is, no diff). It MUST be a bare ref/range/sha: if the resolved value would contain any character outside `[A-Za-z0-9._~^:/@-]` (a space, `;`, `$`, backtick, or a leading `-`), do NOT emit it — `abort` with `unsafe diff_spec`.
        paths     — an array of repo-relative paths actually touched.
        focus     — the focus hint, or "general".

  classify:                            # size the change and route by depth (fresh context; reads the diff)
    type: llm
    effort: low
    allowed-tools: [read, grep, bash, write]
    routes:
      skip:  {to: signoff,        label: "Trivial"}
      quick: {to: review_quick,   label: "Quick review"}
      full:  {to: prep_diff,      label: "Full review"}
    prompt: |
      Size the change and route. Get the change with `git diff ${{ outputs.resolve.diff_spec }}` (if diff_spec is empty, read the files at `${{ outputs.resolve.paths }}`). Focus: ${{ outputs.resolve.focus }}.

      Call the `route` tool once (state the deciding factor in one line first):
        skip  — doc-only / typo / whitespace / comments / generated / version-bump; no semantic code change
        quick — small, single-concern change (a contained fix or minor change)
        full  — feature-scale, cross-cutting, or risk-bearing (auth / input parsing / data layer / shared contracts / concurrency / large diff)

      The costs are asymmetric: under-reviewing a real change loses the review; over-reviewing a small one wastes a dollar. When torn between two tiers, pick the deeper one.

      Before routing `skip`: WRITE `review.md` (cwd-relative, `write` tool) containing a clean `# Code Review` + `## All clear` with a one-line `LGTM: <reason>` — the signoff/post steps read that file.

  review_quick:                        # quick tier — one focused pass → review.md
    type: llm
    effort: medium
    allowed-tools: [read, grep, bash, write]
    next: signoff
    prompt: |
      Quick review of the change: `git diff ${{ outputs.resolve.diff_spec }}` (or read `${{ outputs.resolve.paths }}` if diff_spec is empty). Focus: ${{ outputs.resolve.focus }}. One focused pass: correctness first, plus anything that jumps out on security, performance, duplication of an existing helper, or a behavior change shipped without a test. Single pass — no exhaustive sweep.

      WRITE the review to `review.md` (cwd-relative, `write` tool), this shape:

      # Code Review

      ## Findings
      One per line: `- [critical|high|medium|low] path:line — claim.` with `Why:` and `Fix:` each one sentence. If none, replace with `## All clear` + one sentence (what was reviewed, what you couldn't see).

      ## Next steps
      ≤2 concrete actions, or `No follow-up required.`

      Emit only `WROTE`.

  # ── full tier: a parallel fan-out of six lens BRANCHES, each a two-node
  # scan→verify sub-pipeline running CONCURRENTLY (one run, one log,
  # per-sub-node durable). `prep_diff` materialises the diff ONCE so the
  # read-only branches share it (branches are read-class — no bash); each
  # `*_scan` emits raw typed findings; each `*_verify` re-checks every cited
  # path:line against the actual code and DROPS what it can't substantiate;
  # `synthesize` reconciles the six VERIFIED results. No thread — branches
  # exchange data only via typed outputs (fail-closed), each on its own
  # synthetic thread.
  prep_diff:                           # materialise the diff once for the read-only lens branches
    type: tool
    # `--end-of-options` stops git parsing the substituted (LLM-emitted) diff_spec
    # as its own flags — a poisoned `--ext-diff=…` value can't smuggle a command.
    # The `run:` substitution already shell-quotes the value (blocks shell tokens);
    # this closes the git-option-injection axis. `resolve` also charset-guards it.
    run: "git diff --end-of-options ${{ outputs.resolve.diff_spec }} > review-diff.patch 2>/dev/null; wc -l review-diff.patch"
    next: review_lenses

  review_lenses:
    type: parallel
    branches:
      - correctness_scan
      - integration_scan
      - security_scan
      - performance_scan
      - quality_scan
      - coherence_scan
    next: synthesize
    # Four in flight: full width would race six high-effort scans into provider
    # rate limits at once; the reactive frontier back-fills a slot the moment a
    # branch settles, so the tail two cost little wall-clock.
    concurrency: 4
    # Per-branch wall-clock backstop: a lens scan/verify is read-only
    # deliberation, so 15m is generous. Bounds a runaway llm branch that never
    # self-terminates (which would otherwise dam the join).
    timeout-minutes: 15

  # ── Lens 1: correctness — does the code do what it claims? (deep scan)
  correctness_scan:
    type: llm
    effort: high
    allowed-tools: [read, grep]
    next: correctness_verify
    outputs:
      findings:
        type: array
        items:
          type: object
          fields:
            severity: { type: choice, options: [critical, high, medium, low] }
            location: { type: string }
            claim:    { type: string }
            why:      { type: string }
            fix:      { type: string, optional: true }
    prompt: |
      Read `review-diff.patch` (the change; if empty, read the files at `${{ outputs.resolve.paths }}`). Review it through the **correctness** lens ONLY. Focus: ${{ outputs.resolve.focus }}.

      Go hunk by hunk, and for each, open the cited file and read the ENCLOSING function — bugs in unchanged lines of a touched function are in scope. For every line ask: what input, state, timing, or platform makes this wrong? Hunt: inverted/wrong conditions, off-by-one, null/undefined deref, missing await / unhandled rejection, falsy-zero checks, wrong-variable copy-paste, errors swallowed in catch, races on shared state, broken invariants, unsound type assertions hiding real gaps.

      One finding per issue: `severity` (critical = data loss/corruption or run-killing on a normal path; high = real bug on a likely path; medium = edge path; low = minor), `location` (`path:line`), `claim` (one line), `why` (the concrete failure scenario: inputs/state → wrong outcome), `fix` (omit if none). Be generous — pass through half-believed candidates that have a nameable failure scenario; the verify gate prunes. Cap at the 8 most severe. Empty if clean.

  correctness_verify:
    type: llm
    effort: medium
    allowed-tools: [read, grep]
    next: synthesize
    outputs:
      findings:
        type: array
        items:
          type: object
          fields:
            severity: { type: choice, options: [critical, high, medium, low] }
            location: { type: string }
            claim:    { type: string }
            why:      { type: string }
            fix:      { type: string, optional: true }
    prompt: |
      You gate the **correctness** lens. Raw findings:

      ${{ outputs.correctness_scan.findings }}

      For EACH, open the cited `path:line` and judge against the ACTUAL code. KEEP what is confirmed — or plausible under realistic runtime state (a race, a rare-but-reachable error path, a boundary the code doesn't exclude); recall matters. DROP only what is constructibly refutable: the cited location doesn't exist or contradicts the claim; a type/constant/invariant makes it impossible (name it); the diff itself already guards it (cite the guard); or it's pure style with no observable effect. Re-calibrate severity to the evidence. Emit the filtered `findings` (empty if none survive).

  # ── Lens 2: integration — what does the change break AROUND it? (deep scan)
  integration_scan:
    type: llm
    effort: high
    allowed-tools: [read, grep, find]
    next: integration_verify
    outputs:
      findings:
        type: array
        items:
          type: object
          fields:
            severity: { type: choice, options: [critical, high, medium, low] }
            location: { type: string }
            claim:    { type: string }
            why:      { type: string }
            fix:      { type: string, optional: true }
    prompt: |
      Read `review-diff.patch` (the change; if empty, read `${{ outputs.resolve.paths }}`). Review it through the **integration** lens ONLY — not the changed lines themselves, but what they break around them. Focus: ${{ outputs.resolve.focus }}.

      Two sweeps:
      1. **Removed behavior.** For every line the diff DELETES or replaces, name the invariant or behavior it enforced, then grep the new code for where that invariant is re-established. Can't find it → a candidate (a dropped guard, a narrowed validation, a deleted error path, a weakened test).
      2. **Cross-file contracts.** For each changed function/type/literal, grep for its callers and consumers: a new precondition, a changed return shape, a renamed or removed enum literal still matched as a string elsewhere, a timing/ordering assumption. Hardcoded literal sets (status unions in SQL or label maps) that TypeScript exhaustiveness won't catch are prime targets.

      Same finding shape as every lens: `severity`, `location` (`path:line`), `claim`, `why` (which caller/invariant breaks and how), `fix` (omit if none). Be generous — the verify gate prunes; pass half-believed candidates with a nameable break. Cap at 8. Empty if clean.

  integration_verify:
    type: llm
    effort: medium
    allowed-tools: [read, grep, find]
    next: synthesize
    outputs:
      findings:
        type: array
        items:
          type: object
          fields:
            severity: { type: choice, options: [critical, high, medium, low] }
            location: { type: string }
            claim:    { type: string }
            why:      { type: string }
            fix:      { type: string, optional: true }
    prompt: |
      You gate the **integration** lens. Raw findings:

      ${{ outputs.integration_scan.findings }}

      For EACH, verify the break is real: open the cited caller/consumer AND the changed code; confirm the invariant was actually load-bearing and is actually gone (grep for where it might be re-established under a different name). DROP what is constructibly refutable — the consumer was updated in this same diff (cite the hunk), the invariant is re-established elsewhere (cite it), or the "caller" is dead/test-only code presented as production. KEEP plausible breaks on rare-but-reachable paths. Re-calibrate severity. Emit the filtered `findings` (empty if none survive).

  # ── Lens 3: security — only where the change touches a trust boundary
  security_scan:
    type: llm
    effort: medium
    allowed-tools: [read, grep]
    next: security_verify
    outputs:
      findings:
        type: array
        items:
          type: object
          fields:
            severity: { type: choice, options: [critical, high, medium, low] }
            location: { type: string }
            claim:    { type: string }
            why:      { type: string }
            fix:      { type: string, optional: true }
    prompt: |
      Read `review-diff.patch` (the change; if empty, read `${{ outputs.resolve.paths }}`). Review it through the **security** lens ONLY, and only where it touches a trust boundary (auth / input parsing / shell or SQL construction / crypto / secrets / external I/O / deserialisation). If it doesn't, emit an empty `findings` array — say so in one line first. Look for: injection (SQL/shell/XSS/path traversal — especially values that travel from model output or user input into a command or query), unvalidated input across trust boundaries, auth/authz gaps, secret leaks into logs or artifacts, unsafe deserialisation, weak crypto, SSRF. Check surrounding sanitisation before flagging.

      Same finding shape; `why` names the attack path end to end. Be generous — verify prunes. Cap at 8. Empty if no security surface.

  security_verify:
    type: llm
    effort: medium
    allowed-tools: [read, grep]
    next: synthesize
    outputs:
      findings:
        type: array
        items:
          type: object
          fields:
            severity: { type: choice, options: [critical, high, medium, low] }
            location: { type: string }
            claim:    { type: string }
            why:      { type: string }
            fix:      { type: string, optional: true }
    prompt: |
      You gate the **security** lens. Raw findings:

      ${{ outputs.security_scan.findings }}

      For EACH, open the cited `path:line` and walk the claimed attack path against the actual code, INCLUDING the sanitisation/escaping around it. DROP what is unverifiable, contradicted, or already mitigated nearby (cite the mitigation — a charset guard upstream counts). KEEP a plausible path even if exploiting it needs an unusual-but-reachable input. Re-calibrate severity to real exposure. Emit the filtered `findings` (empty if none survive).

  # ── Lens 4: performance & resource retention — only where the change has the surface
  performance_scan:
    type: llm
    effort: medium
    allowed-tools: [read, grep]
    next: performance_verify
    outputs:
      findings:
        type: array
        items:
          type: object
          fields:
            severity: { type: choice, options: [critical, high, medium, low] }
            location: { type: string }
            claim:    { type: string }
            why:      { type: string }
            fix:      { type: string, optional: true }
    prompt: |
      Read `review-diff.patch` (the change; if empty, read `${{ outputs.resolve.paths }}`). Review it through the **performance & resource retention** lens ONLY, and only where the change touches a hot path / data layer / loops / long-lived process state. If it doesn't, emit an empty `findings` array — say so in one line first. Look for: complexity surprises (O(n²) on a hot path), N+1 queries, unbounded reads where a bounded query exists, repeated work inside per-event or per-render paths, blocking I/O on a hot loop — and RETENTION: timers/listeners armed but never cleared, closures capturing large scopes for long-lived objects, maps/sets that accumulate per-item entries with no cleanup. Confidence proportional to evidence; no cold-path constant-factor nits.

      Same finding shape; `why` names the cost concretely (what scales with what; what stays reachable for how long). Be generous — verify prunes. Cap at 8. Empty if no surface.

  performance_verify:
    type: llm
    effort: medium
    allowed-tools: [read, grep]
    next: synthesize
    outputs:
      findings:
        type: array
        items:
          type: object
          fields:
            severity: { type: choice, options: [critical, high, medium, low] }
            location: { type: string }
            claim:    { type: string }
            why:      { type: string }
            fix:      { type: string, optional: true }
    prompt: |
      You gate the **performance** lens. Raw findings:

      ${{ outputs.performance_scan.findings }}

      For EACH, open the cited `path:line` and confirm the cost claim against the actual code: is the path actually hot or the object actually long-lived? is the bound actually unbounded? does anything clear the timer/listener you'd have to read past the hunk to see? DROP cold-path nits, speculative scaling claims with no driver, and anything the code contradicts. KEEP confirmed waste and retention even when moderate. Re-calibrate severity. Emit the filtered `findings` (empty if none survive).

  # ── Lens 5: quality — reuse, simplification, altitude (deep scan; the
  # design-debt lens: a change can be bug-free and still wrong)
  quality_scan:
    type: llm
    effort: high
    allowed-tools: [read, grep, find]
    next: quality_verify
    outputs:
      findings:
        type: array
        items:
          type: object
          fields:
            severity: { type: choice, options: [high, medium, low] }
            location: { type: string }
            claim:    { type: string }
            why:      { type: string }
            fix:      { type: string, optional: true }
    prompt: |
      Read `review-diff.patch` (the change; if empty, read `${{ outputs.resolve.paths }}`). Review it through the **quality** lens ONLY — design debt, not defects. Focus: ${{ outputs.resolve.focus }}. Three sweeps:

      1. **Reuse.** New code that re-implements something the codebase already has — grep shared/utility modules and files adjacent to the change; name the existing helper and BOTH locations. Near-identical blocks introduced in two places by this same diff count double.
      2. **Simplification.** Complexity the diff adds that a simpler form does the same job for: redundant or derivable state (two sources of truth that can disagree), copy-paste with slight variation, flags/params constant at every call site, dead code, deep nesting a guard clause flattens. Name the simpler form.
      3. **Altitude.** Is each change implemented at the right DEPTH? Special cases layered on shared infrastructure are the smell — an `if (x === 'newKind')` scattered through shared paths where the mechanism should generalize; a fix at the call site that belongs in the callee; string-encoded identity parsed in multiple layers where a structured field belongs. Name the deeper mechanism.

      Finding shape: `severity` (high = drift-prone duplication of a shared mechanism or a wrong-depth fix that the next change will silently break; medium = real but contained; low = polish — never use critical), `location`, `claim`, `why` (the CONCRETE cost: what drifts, what stays harder to change), `fix` (the named helper / simpler form / deeper mechanism). Be generous — verify prunes. Cap at 8. Empty if clean.

  quality_verify:
    type: llm
    effort: medium
    allowed-tools: [read, grep, find]
    next: synthesize
    outputs:
      findings:
        type: array
        items:
          type: object
          fields:
            severity: { type: choice, options: [high, medium, low] }
            location: { type: string }
            claim:    { type: string }
            why:      { type: string }
            fix:      { type: string, optional: true }
    prompt: |
      You gate the **quality** lens. Raw findings:

      ${{ outputs.quality_scan.findings }}

      For EACH: open BOTH cited locations (duplication claims need both to exist and genuinely overlap), and pressure-test the proposed fix — does the named helper actually fit this call site? does the simpler form actually preserve behavior (check the edge case it might drop)? does the deeper mechanism actually exist to extend? DROP aesthetic preferences, "could be shorter" with no concrete cost, fixes that don't survive contact with the real code, and duplication where the two sites legitimately differ. KEEP findings whose cost is real and whose fix is actionable. Re-calibrate severity (never critical). Emit the filtered `findings` (empty if none survive).

  # ── Lens 6: coherence — tests, docs, and repo conventions
  coherence_scan:
    type: llm
    effort: low
    allowed-tools: [read, grep, find, ls]
    next: coherence_verify
    outputs:
      findings:
        type: array
        items:
          type: object
          fields:
            severity: { type: choice, options: [high, medium, low] }
            location: { type: string }
            claim:    { type: string }
            why:      { type: string }
            fix:      { type: string, optional: true }
    prompt: |
      Read `review-diff.patch` (the change; if empty, read `${{ outputs.resolve.paths }}`). Review it through the **coherence** lens ONLY: does the change carry its obligations? Three sweeps:

      1. **Tests.** Each behavior change in the diff: does a new or updated test pin it? Flag changed behavior with no test, tests the diff weakened or deleted whose case still matters, and tests asserting the OLD behavior left passing by accident.
      2. **Docs & comments.** Claims the diff invalidates: README/docs statements about the changed area, comments inside or adjacent to the hunks that now describe the old behavior, stale references to renamed/removed things (grep the old names).
      3. **Conventions.** Read the repo's contribution rules if present (`CLAUDE.md`, `AGENTS.md`, `CONTRIBUTING.md`) and flag violations the diff introduces — only rules the file actually states, cited.

      Finding shape: `severity` (high = changed behavior with no test, or a doc/spec claim now actively wrong; medium = stale comment/reference; low = polish — never critical), `location`, `claim`, `why`, `fix` (omit if none). Be generous — verify prunes. Cap at 8. Empty if clean.

  coherence_verify:
    type: llm
    effort: medium
    allowed-tools: [read, grep, find, ls]
    next: synthesize
    outputs:
      findings:
        type: array
        items:
          type: object
          fields:
            severity: { type: choice, options: [high, medium, low] }
            location: { type: string }
            claim:    { type: string }
            why:      { type: string }
            fix:      { type: string, optional: true }
    prompt: |
      You gate the **coherence** lens. Raw findings:

      ${{ outputs.coherence_scan.findings }}

      For EACH: confirm against the tree — a "missing test" claim dies if a test elsewhere covers the behavior (grep the test directories for the symbol/behavior before keeping it); a "stale doc" claim dies if the cited text doesn't exist or still holds; a convention claim dies unless the rules file states the rule (quote it). DROP anything the diff itself already addressed. Re-calibrate severity (never critical). Emit the filtered `findings` (empty if none survive).

  synthesize:                          # reconcile the six VERIFIED lens results → write review.md
    type: llm
    model: claude-opus-4-7
    effort: high
    allowed-tools: [read, grep, write]
    next: verify
    prompt: |
      Reconcile the six verified lens results into one review and WRITE it to `review.md` (cwd-relative, `write` tool). The findings are typed arrays of already-verified items:

        correctness: ${{ outputs.correctness_verify.findings }}
        integration: ${{ outputs.integration_verify.findings }}
        security:    ${{ outputs.security_verify.findings }}
        performance: ${{ outputs.performance_verify.findings }}
        quality:     ${{ outputs.quality_verify.findings }}
        coherence:   ${{ outputs.coherence_verify.findings }}

      Merge: a concern surfaced by two lenses is ONE entry at the higher severity, noted `(cross-flagged)`. Re-calibrate severity across the merged set — you see the whole change; the lenses each saw a slice. Where a quality finding and a defect share a root cause, say so (the fix that resolves both leads).

      File shape, headings exactly:
        `# Code Review`
        `## Scope` — one paragraph: the touched packages/areas (`${{ outputs.resolve.paths }}`), change type, which lenses found anything and which came back clean.
        `## Defects` — subsections `### Critical` / `### High` / `### Medium` / `### Low` (omit empty ones) for correctness/integration/security/performance findings. Per finding: **path:line** — one-line claim. `Why:` one sentence. `Fix:` one sentence or short snippet.
        `## Improvements` — the quality/coherence findings, same per-finding shape, ordered by severity. These are debt, not defects — keep them separate so neither dilutes the other.
        If every array is empty: replace both sections with `## All clear` (one paragraph: what was reviewed, what you couldn't see, confidence).
        `## Next steps` — at most 3 ordered actions, or `No follow-up required.`

      Emit only `WROTE`.

  verify:                              # full tier — automated evidence-quality gate over review.md
    type: llm
    effort: low
    retry: synthesize                  # REJECT ⇒ re-synthesise (capped)
    max-retries: 2
    allowed-tools: [read, grep]
    next: signoff
    prompt: |
      Read `review.md` (cwd-relative) — the review under gate. Judge on its own merits.
        1. Every finding's path:line is verifiable — spot-check 3 by reading the cited path.
        2. Severity calibration sane (no `low` for a data-loss claim, no `critical` nitpicks; quality/coherence items live under Improvements, never inflated into Defects).
        3. Schema followed — Scope present and names the lens coverage; Defects/Improvements sections (or All clear); Next steps present.
      All pass → reply EXACTLY `APPROVE`. Else `abort` with `REJECT: <one-line worst violation>`.

  signoff:                             # human gate after skip / quick / full
    type: human
    text: "Review written to review.md (and visible in the synthesize/quick step output). Approve the PR, post it as feedback, or keep it local?"
    routes:
      approve:  {to: pr_approve,  label: "Approve PR"}
      feedback: {to: pr_feedback, label: "Post feedback"}
      accept:   {to: exit,        label: "Keep local"}

  pr_approve:                          # post the review + APPROVE the PR
    type: llm
    model: claude-haiku-4-5
    allowed-tools: [read, bash]
    next: exit
    prompt: |
      PR number: ${{ outputs.resolve.pr }}. The review body is in `review.md` (cwd-relative).
      If the PR number is `none` (local diff, no PR), emit `LGTM (no PR to approve)` and stop — don't post.
      Otherwise `gh pr review ${{ outputs.resolve.pr }} --approve --body-file review.md` and emit `APPROVED: PR ${{ outputs.resolve.pr }} <url>`.

  pr_feedback:                         # post the review; request-changes if blocking, else comment
    type: llm
    model: claude-haiku-4-5
    allowed-tools: [read, bash]
    next: exit
    prompt: |
      PR number: ${{ outputs.resolve.pr }}. The review body is in `review.md` (cwd-relative) — read it.
      If the PR number is `none`, emit `feedback kept local (no PR)` and stop.
      Otherwise: if `review.md` has any Critical or High DEFECT, `gh pr review ${{ outputs.resolve.pr }} --request-changes --body-file review.md`; else `gh pr review ${{ outputs.resolve.pr }} --comment --body-file review.md` (Improvements alone never block). Emit `POSTED: PR ${{ outputs.resolve.pr }} <changes|comment> <url>`.
