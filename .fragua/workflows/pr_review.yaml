# pr_review.yaml — unattended PR review for CI: scope-and-classify → review
# scaled to the change → classify the verdict → post the review back to the PR.
# NO human gate.
#
# The non-HITL sibling of `review`. Where `review` ends at a `signoff` human
# step, `pr_review` runs to completion under `fragua ci pr_review --input pr=<n>`
# and posts the review itself. A dedicated `verdict` route node reads the written
# review and classifies it by WORST severity into one of two terminal posts:
#   changes  — any Critical or High finding   (gh pr review --request-changes)
#   comment  — everything else (incl. clean)   (gh pr review --comment)
# The verdict is a first-class routing decision (auditable in the event log),
# not a `$(cat verdict.txt)` shell hack. There is NO `approve` post and NO
# auto-merge: a bot using GITHUB_TOKEN cannot post an APPROVED review state, so
# the verdict is a human-facing signal — a human merges. (CHANGES_REQUESTED can
# still gate a merge via branch protection; that's the operator's choice.)
#
# The classifier still scales depth (skip/quick/full) so a typo PR never draws
# an Opus full pass. Runs in the CI checkout's worktree: the PR's files are on
# disk (read them directly) and `gh pr diff <n>` gives the diff. Needs GH_TOKEN
# in env (pr-review.yml sets it) plus a provider credential.
#
#   fragua ci pr_review --input pr=128

name: pr_review
goal: Unattended PR review for CI — review scaled to the change, classified into a verdict, posted back to the PR (comment or request-changes) with no human gate.
budget: 21.00 # covers the full lens-split + verify-retry path: scope (0.40) + 3 lens passes (3×2.00, once) + 3×(synthesize 1.00 + verify 0.60 on each retry) + verdict (0.15) ≈ 11.4, with headroom so a retry never halts mid-pass on the cap. verify retargets `synthesize` (cheap re-synthesise), not the lenses, so retries don't re-run the deep passes.

inputs:
  pr:
    type: string
    required: true
    description: PR number to review (e.g. 128)

defaults:
  provider: anthropic
  model: claude-sonnet-4-6

steps:
  scope:                               # resolve the PR diff + size the change; routes
    type: llm
    thread: review
    allowed-tools: [read, grep, find, bash, write]
    max-cost: 0.40
    prompt: |
      Review PR #${{ inputs.pr }}. Its files are already checked out on disk — read them directly. Get the diff with `gh pr diff ${{ inputs.pr }}` and metadata with `gh pr view ${{ inputs.pr }} --json baseRefName,title`.

      Empty or failing diff → `abort` with `no diff for PR ${{ inputs.pr }}`.

      Emit (no preamble, ≤8 lines):
        PR: ${{ inputs.pr }}
        TITLE: <pr title>
        BASE: <base branch>
        PATHS: <comma-sep, real on-disk, repo-relative>
        LOC: <approx>
        FOCUS: general

      Then size the change and call the `route` tool once (state the deciding factor in one line first):
        skip  — doc-only / typo / whitespace / comments / generated / version-bump; no semantic code change
        quick — small, single-concern change (a contained fix or minor change)
        full  — feature-scale, cross-cutting, or risk-bearing (auth / input parsing / data layer / shared contracts / large diff)

      For `skip`: write `pr-review.md` (cwd-relative, `write` tool) containing a clean `LGTM: <reason>` as the whole review, before you route skip — the `verdict` node reads it (LGTM ⇒ approve).
    routes:
      skip:  {to: verdict,             label: "Trivial"}
      quick: {to: review_quick,        label: "Quick review"}
      full:  {to: review_correctness,  label: "Full review"}

  review_quick:                        # quick tier — one focused pass
    # Intentionally routes straight to `verdict` with NO `verify` gate: this tier
    # only fires for small, single-concern changes (low blast radius), so the
    # verdict classifier is the sole gate. Only the `full` tier — feature-scale,
    # risk-bearing — earns the evidence-quality gate (and its retry cost).
    type: llm
    thread: review
    allowed-tools: [read, grep, bash, write]
    max-cost: 0.40
    next: verdict
    prompt: |
      Quick review of PR #${{ inputs.pr }} (`gh pr diff ${{ inputs.pr }}`; read the changed files directly). `-` lines are removed (context only — don't flag); flag only `+`/changed lines. One focused pass over correctness and any obvious security issue — it's a small change, keep it to a single pass.

      THE BAR: record a finding ONLY if it has a concrete, present consequence (wrong output, data loss, a crash, a security hole) and a specific fix. DROP formatting, naming, comment/doc wording, "consider …" suggestions, speculation about code that doesn't exist, and anything whose worst case is "might confuse a reader". When unsure, drop it — a clean small PR should come back `All clear`.

      WRITE the review to `pr-review.md` (cwd-relative) with the `write` tool — do NOT print it to the thread (the `verdict` step reads the file; re-emitting the body burns the node's cost twice). Use the SAME severity-section shape as the full tier (one format for the `verdict` classifier to read). Headings exactly: `# Code Review` / `## Critical` / `## High` / `## Medium` (there is no Low tier).

      Per finding under its severity heading: **path:line** — one-line claim. `Why:` one sentence (the consequence). `Fix:` one sentence. Drop a severity heading only if it has no findings; if nothing clears the bar, replace the severity sections with `## All clear` (one sentence: what was reviewed, what you couldn't see).

      End with `## Next steps` — ≤2 concrete actions, or `No follow-up required.`

      Emit only `WROTE` (do NOT reprint the review).

  # ── full tier: three focused lens passes, each emitting typed findings ──
  # Each lens shares the `review` thread (inherits scope's PR/PATHS/diff context)
  # but hands its result to `synthesize` as a typed `findings[]` via emit_output —
  # so the synthesizer aggregates three clean producers instead of disentangling
  # prose. THE BAR (below) is enforced in every lens AND re-checked at synthesize.
  # In a diff `-` lines are REMOVED (context only, never flag); only `+`/changed
  # lines are in scope. A lens whose surface the diff doesn't touch emits [].
  #
  # THE BAR (every lens): record a finding ONLY if it has a concrete, PRESENT
  # consequence (wrong output, data loss, a crash, a security hole, or a
  # maintenance cost that bites a near-term change) AND a specific fix. DROP
  # formatting/naming/doc-wording nits, "consider …" preferences, speculative
  # future-author/hypothetical concerns, intra-workspace API-stability opinions,
  # guards against inputs that can't occur, and anything in UNCHANGED code. When
  # unsure, drop it — a clean PR SHOULD come back empty.
  review_correctness:
    type: llm
    model: claude-opus-4-7
    effort: high
    thread: review
    allowed-tools: [read, grep, bash]
    max-cost: 2.00
    next: review_security
    outputs:
      findings:
        type: array
        items:
          type: object
          fields:
            severity: { type: choice, options: [critical, high, medium] }
            location: { type: string }
            claim:    { type: string }
            why:      { type: string }
            fix:      { type: string, optional: true }
    prompt: |
      Review PR #${{ inputs.pr }} (`gh pr diff ${{ inputs.pr }}`; read the changed files directly) through the **correctness** lens ONLY: logic bugs, off-by-one, races, missing null checks, broken invariants, mishandled errors/promises, type unsoundness, dead branches, real edge cases. Cross-check call sites where it matters. Apply THE BAR (see the workflow header rule). `-` lines are context, never flag.

      Call `emit_output` once with `findings` — one record per issue: `severity` (critical/high/medium — no low tier), `location` (`path:line`), `claim` (one line), `why` (the concrete consequence), `fix` (one sentence; omit if none). NO INVENTION. Empty array if nothing clears the bar.

  review_security:
    type: llm
    model: claude-opus-4-7
    effort: high
    thread: review
    allowed-tools: [read, grep, bash]
    max-cost: 2.00
    next: review_performance
    outputs:
      findings:
        type: array
        items:
          type: object
          fields:
            severity: { type: choice, options: [critical, high, medium] }
            location: { type: string }
            claim:    { type: string }
            why:      { type: string }
            fix:      { type: string, optional: true }
    prompt: |
      Review PR #${{ inputs.pr }} through the **security** lens ONLY, and only where the diff touches a trust boundary (auth / input parsing / crypto / secrets / external I/O). If it doesn't, emit an empty `findings` array. Look for: injection (SQL/shell/XSS/path traversal), unvalidated input across trust boundaries, auth/authz gaps, secret leaks, unsafe deserialisation, weak crypto, SSRF. Check surrounding sanitisation before flagging. Apply THE BAR; `-` lines are context.

      Call `emit_output` once with `findings` (same shape; severities critical/high/medium). NO INVENTION. Empty array if no security surface or nothing clears the bar.

  review_performance:
    type: llm
    model: claude-opus-4-7
    effort: high
    thread: review
    allowed-tools: [read, grep, bash]
    max-cost: 2.00
    next: synthesize
    outputs:
      findings:
        type: array
        items:
          type: object
          fields:
            severity: { type: choice, options: [critical, high, medium] }
            location: { type: string }
            claim:    { type: string }
            why:      { type: string }
            fix:      { type: string, optional: true }
    prompt: |
      Review PR #${{ inputs.pr }} through the **performance** lens ONLY, and only where the diff touches a hot path / data layer / loops / large payloads. If it doesn't, emit an empty `findings` array. Look for: complexity surprises (O(n^2) on a hot path), N+1, unbounded work, blocking I/O on hot paths, oversized payloads. Confidence proportional to evidence; no cold-path constant-factor nits. Apply THE BAR; `-` lines are context.

      Call `emit_output` once with `findings` (same shape; severities critical/high/medium). NO INVENTION. Empty array if no perf surface or nothing clears the bar.

  synthesize:                          # aggregate the three typed lens results → write pr-review.md
    type: llm
    thread: review
    allowed-tools: [read, grep, write]
    max-cost: 1.00
    next: verify
    prompt: |
      Combine the three lens results into one ranked review and WRITE it to `pr-review.md` (cwd-relative, `write` tool) — do NOT print the body to the thread (the `verdict` step reads the file). The findings are typed arrays:

        correctness: ${{ outputs.review_correctness.findings }}
        security:    ${{ outputs.review_security.findings }}
        performance: ${{ outputs.review_performance.findings }}

      Merge them: a concern surfaced by two lenses is ONE entry at the higher severity, noted `(cross-flagged)`. Re-apply THE BAR across the merged set and drop anything that doesn't clear it. The file's content, headings exactly: `# Code Review` / `## Scope` / `## Critical` / `## High` / `## Medium` (there is NO Low tier).

      ## Scope: one paragraph naming the touched packages/areas and the change type; name which lenses found anything.

      Per finding: **path:line** — one-line claim. `Why:` one sentence (the concrete consequence). `Fix:` one sentence or short snippet.

      If all three arrays are empty (or nothing clears the bar), replace the severity sections with `## All clear` (one paragraph: what was reviewed, what you couldn't see, confidence). End the file with `## Next steps` — ≤3 ordered actions, or `No follow-up required.`

      After the file is written, emit only `WROTE`.

  verify:                              # full tier — automated evidence-quality gate
    type: llm
    thread: review
    retry: synthesize                  # REJECT ⇒ re-synthesise (capped; budget covers the full path)
    max-retries: 2
    allowed-tools: [read, grep]
    max-cost: 0.60
    next: verdict
    prompt: |
      Read `pr-review.md` (the review under gate). Judge on its own merits.
        1. Every finding's path:line is verifiable — spot-check 2-3 by reading the cited path.
        2. Severity calibration sane (no Critical for a contained issue; cross-flagged ≥ High; and no nitpick dressed as High to force a `changes` verdict).
        3. THE BAR held — NO recorded finding is a formatting/naming/doc-wording nit, a "consider …" preference, a speculative future-author or hypothetical concern, an intra-workspace API-stability opinion, or a guard against an input that can't occur. Those must be DROPPED, not recorded at any severity.
        4. Schema followed — Scope present; Critical/High/Medium ordered (no Low tier) or replaced by All clear; Next steps present.
      All pass → reply EXACTLY `APPROVE`. Else `abort` with `REJECT: <one-line worst violation>` (e.g. "nitpick recorded as Medium", "over-severe High", "unverifiable claim").

  verdict:                             # classify the written review → route to one of two posts.
    # A cheap isolated classifier (no thread): reads pr-review.md fresh and decides the GitHub review
    # action by worst severity. The route is the verdict — first-class + auditable, no verdict file.
    # Only `changes` and `comment` — a GITHUB_TOKEN bot cannot post an APPROVED state, so a clean
    # review is a `comment` (its body says All clear / LGTM); there is no approve post.
    type: llm
    model: claude-haiku-4-5
    allowed-tools: [read]
    max-cost: 0.15
    prompt: |
      Read `pr-review.md`. Classify it by its WORST finding and call `route` once (state the deciding severity in one line first):
        changes  — there is any Critical or High finding
        comment  — everything else (only Medium findings, an `All clear`, or an `LGTM`)
      You MUST end by calling the `route` tool exactly once. Do not reply with prose instead of routing.
    routes:
      comment: {to: post_comment, label: "Comment"}
      changes: {to: post_changes, label: "Request changes"}

  # Two terminal posts — each a PURE TOOL node (no LLM): the body is already a file, so posting is one
  # deterministic gh call (the states a GITHUB_TOKEN bot can actually post). A non-zero gh exit routes
  # to exit gracefully rather than halting with aborted_exit.
  post_comment:
    type: tool
    run: gh pr review ${{ inputs.pr }} --comment --body-file pr-review.md
    on:
      success: exit
      fail: exit
  post_changes:
    type: tool
    run: gh pr review ${{ inputs.pr }} --request-changes --body-file pr-review.md
    on:
      success: exit
      fail: exit
