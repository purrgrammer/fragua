# mcp-smoke.yaml — a tiny READ-ONLY smoke test of MCP tools from github + clickup,
# to see how materialised MCP tools + their calls render in the web UI.
#
# Read-only by instruction: the prompt forbids any mutating tool. One llm step,
# opts into both servers, calls a couple of list/search tools, summarises.
#
#   bun run fragua run mcp-smoke

name: mcp-smoke
goal: Exercise a few read-only MCP tools from the github and clickup servers and summarise what came back.

defaults:
  provider: anthropic
  model: claude-sonnet-4-6

steps:
  probe:
    type: llm
    mcp-servers: [github, clickup]
    # Narrow the MCP set to exactly two read-only tools — naming mcp__ tools in
    # allowed-tools pins the step to them (enforces read-only structurally, not
    # just by prompt).
    allowed-tools: [mcp__github__search_repositories, mcp__clickup__clickup_get_workspace_members]
    max-cost: 0.75
    next: exit
    prompt: |
      Smoke test of MCP tools. Only two tools are available to you:
      `mcp__github__search_repositories` and `mcp__clickup__clickup_get_workspace_members`.

      Do exactly this, then stop:
      1. Call `mcp__github__search_repositories` to find a few of the authenticated
         user's repositories (query `user:@me`, perPage 3). Report up to 3 names.
      2. Call `mcp__clickup__clickup_get_workspace_members` and report, briefly,
         what it returned.

      Finish with a 2–3 line summary naming the tools you called and what each
      returned. Reply with just that summary — no further tool calls.
