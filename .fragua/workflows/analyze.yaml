# analyze.yaml — mine recent fragua runs for cost / confusion / redundancy patterns.
#
# Loop A from the meta-evaluation design: discovery only. A single llm
# runs `.fragua/scripts/analyze/collect.ts` via the bash tool to get a JSON
# snapshot of recent runs, then synthesises evidence-backed hypotheses in
# its own reply. Does NOT apply changes — that lives in a separate optimize
# workflow with an eval gate.
#
# Defaults: --since-days 7 --limit 200. Picks up low-traffic drift
# workflows that run 1–2×/week; capped so cost stays bounded on
# high-traffic projects. Override via inputs as needed.
#
#   bun run fragua run analyze
#   bun run fragua run analyze --input workflow=change
#   bun run fragua run analyze --input since-days=30
#   bun run fragua run analyze --input limit=50

name: analyze
goal: Mine recent fragua runs for cost, confusion, and redundancy patterns; emit ranked, evidence-backed hypotheses for workflow improvements.
budget: 1.50

inputs:
  workflow:
    type: string
    description: Filter to a single workflow name (optional)
    default: ""
  since-days:
    type: number
    default: 7
  limit:
    type: number
    default: 200

defaults:
  provider: anthropic
  model: claude-sonnet-4-6

steps:
  analyze:
    type: llm
    next: exit
    allowed-tools: [bash, read]
    effort: high
    max-cost: 1.20
    prompt: |
      Audit recent fragua runs and emit ranked, evidence-backed improvement hypotheses.

      First: run `bun .fragua/scripts/analyze/collect.ts --workflow=${{ inputs.workflow }} --since-days=${{ inputs.since-days }} --limit=${{ inputs.limit }}` via the bash tool and read its JSON report. Fields: `totals`, `by_workflow[]` (aggregates + `node_profiles[]`), `runs[]` (per-run records + `per_node[]`). Trust its numbers; quote only them; never invent fields.

      Field caveats: `partial`/`partial_in_runs` figures are lower bounds (node still running). `dispatch_seconds` = wall − llm − tool (setup/queue/network, not compute). `node_type` of `tool`/`start`/`exit` is non-LLM — zero tokens is expected, not a gap.

      Emit a markdown report as your FINAL message verbatim — no file writes, no preamble, no postscript. Headings, exactly:

      # Fragua Analysis — <ISO date from collected_at>

      ## Scope
      One paragraph: total runs, distinct workflows, time window, sum cost. Note workflows with <3 runs are listed but not analysed.

      ## Per-workflow findings
      Per workflow with n_runs >= 3, a `### <workflow>` subsection:
      **Health.** One paragraph: status mix, cost p50/p90, token p50/p90, mean duration, models.
      **Hypotheses.** Up to 5, ranked by impact * confidence. Each a numbered item with labelled lines — **Claim:** the pattern in one sentence. **Evidence:** specific run_ids and >=2 numbers from the JSON. **Proposed change:** one concrete edit (prompt reword, max-retries, model swap, step split, tool removal), naming the .yaml file and step. **Confidence:** low|medium|high + one sentence why. **Estimated impact:** cost delta $/%, or token delta, or reliability with a number.
      Zero confusion signals (no aborts/steers/retargets/halts) + tight cost variance → 'no actionable hypotheses; workflow appears healthy'. Don't manufacture findings.

      ## Workflows below sample threshold
      <workflow> (n=N): not analysed. One line each.

      ## Cross-workflow observations
      Only if something holds across workflows; else omit.

      Rules: cite numbers not vibes; one run = low confidence, probably skip; a wanted-but-absent signal goes under a final '## Signals not collected'.
