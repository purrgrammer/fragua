# fragua project config — <project>/.fragua/config.yaml.
# Project-specific knobs only. Generic preferences live in
# ~/.fragua/config.yaml and cascade under this file.

# Stack-agnostic bootstrap. Runs inside each fresh worktree before the
# first node fires, after `git worktree add`. Non-zero exit fails the
# run. Project-specific because the command depends on the project's
# stack (bun / pnpm / pip / cargo / …).
bootstrap: bun install --frozen-lockfile
