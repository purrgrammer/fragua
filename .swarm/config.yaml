# swarm project configuration
#
# This file is loaded automatically by the CLI when running commands from
# the repo root. Overrides apply unless --flag provides an explicit value.
#
# See docs/SPEC.md for what each field means.

project:
  name: swarm
  runs_dir: .swarm/runs

defaults:
  # Multi-provider: swap to any provider pi-ai supports — see `swarm providers`.
  # Examples:
  #   provider: anthropic       | ANTHROPIC_API_KEY
  #   provider: openai          | OPENAI_API_KEY
  #   provider: openrouter      | OPENROUTER_API_KEY   (300+ models, one key)
  #   provider: google          | GEMINI_API_KEY
  #   provider: groq            | GROQ_API_KEY
  provider: openrouter
  model: anthropic/claude-opus-4.7

  # Tool permission mode. Phase 2 supports unsafe only. Phase 6 will add
  # classifier + interactive.
  permissions: unsafe

  # Weak-model summariser (Wave 2b). Powers:
  #   - async pipeline-title generation from $ARGUMENTS (see `auto_title`)
  #   - fidelity=summary:medium|high compression of prior node transcripts
  # Always cheaper than the primary coding model. Leave unset to disable
  # all summarisation — title generation silently skips; fidelity=summary:*
  # falls back to the deterministic `summary:low` template with a warning.
  summariser:
    provider: openrouter
    model: anthropic/claude-haiku-4.5

# Auto-generated pipeline titles from $ARGUMENTS. "on" (default) kicks off a
# fire-and-forget summariser call at pipeline start and emits
# pipeline.title_generated when it resolves. "off" disables. CLI flag
# --no-auto-title wins over this.
auto_title: on

# Command blocklist applied even in unsafe mode. Matched as literal substrings
# against the shell command. Zero-cost safety floor.
blocklist:
  - "rm -rf /"
  - "rm -rf ~"
  - "rm -rf ."
  - "rm -rf .."
  - "sudo "
  - "curl | sh"
  - "curl|sh"
  - "wget | sh"
  - "wget|sh"
  - "git push --force origin main"
  - "git push --force origin master"

# Workflows the user can invoke by name (e.g. `swarm run build-feature`).
# Values are paths relative to the repo root.
workflows:
  build-feature: workflows/build-feature.dot

# Skills (agentskills.io progressive-disclosure model).
#
# `paths` pins discovery to the listed directories and disables the
# well-known auto-discovery paths (~/.agents/skills, ~/.claude/skills,
# etc.) — so only this repo's .agents/skills/ is scanned. Drop the
# `paths` block and the whole `skills:` section to turn auto-discovery
# back on.
skills:
  paths:
    - .agents/skills
