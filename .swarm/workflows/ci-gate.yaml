# ci-gate.yaml — lint → typecheck → test, halt on first failure.
#
# All tool steps, no LLM. Exit 0 → success (flows to the next step),
# non-zero → fail. No step declares a fail route, so the first failing
# command halts the run with fail status — failure handling is opt-in
# and we don't want a recovery path here.
#
#   bun run swarm run ci-gate
#   bun run swarm run ci-gate --input pattern="packages/store"

name: ci-gate
goal: Run lint, typecheck, and tests in sequence. Halt on first failure.

inputs:
  pattern:
    type: string
    description: Test pattern (passed to `bun test`)
    default: ""

steps:
  lint:
    type: tool
    run: bun run lint
  typecheck:
    type: tool
    run: bun run --filter='*' typecheck
  test:
    type: tool
    run: bun test ${{ inputs.pattern }}
