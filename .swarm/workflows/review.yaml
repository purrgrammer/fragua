# review.yaml — multi-lens code review with parallel sub-agents.
#
# PRECONDITION for PR / branch inputs: working tree must be clean. The scope
# step will `gh pr checkout <n>` (or `git checkout <branch>`) so lenses can
# read files on disk directly. If the tree is dirty, scope aborts with a
# suggestion to commit / stash. After the run, your checkout will be on the
# PR / target branch — `git checkout -` to return.
#
# scope:      resolves `target:` into TARGET / PATHS / LOC / FOCUS / CONTEXT /
#             CHECKOUT; checks out PR/branch when applicable.
# dispatch:   fans out four named lens agents in parallel — lens-correctness
#             / lens-security / lens-performance / lens-architecture.
# synthesize: reads the lens results off the shared thread, dedupes, ranks,
#             and emits the final review (severity sections + next steps).
# verify:     goal-gate. Spot-checks evidence + severity calibration. REJECT
#             retargets synthesize (lens results are still in the thread).
#
# Input forms:
#   - empty                             → uncommitted changes (`git diff HEAD`)
#   - "<commitish>"                     → e.g. "HEAD~3..HEAD", a sha
#   - "<path-or-glob>"                  → e.g. "packages/server/src"
#   - "PR <n>" / "<branch>"             → checks out, diff vs base
#   - any of the above + free-text hint → e.g. "src/auth.ts focus on session"

name: review
goal: Multi-lens code review (correctness, security, performance, architecture) with deduped, ranked synthesis and an evidence-quality gate.
budget: 2.50

inputs:
  target:
    type: string
    default: ""
    description: PR number, branch, path, commitish, or free-form hint

defaults:
  provider: anthropic
  model: claude-sonnet-4-6

steps:
  scope:
    type: llm
    thread: review
    allowed-tools: [read, grep, find, bash]
    max-cost: 0.30
    prompt: |
      Determine review target from `${{ inputs.target }}` and prep the tree.

      Classify into: DIFF <base>..<head> | FILES <paths> | UNCOMMITTED. Defaults: empty→UNCOMMITTED, ref/range/sha→DIFF, path/glob→FILES, 'PR <n>'/branch→DIFF (with checkout).

      For PR/branch DIFF: 1) `git status --porcelain` — if non-empty, emit `<abort>working tree dirty</abort>`. 2) `gh pr checkout <n>` or `git fetch origin <branch> && git checkout <branch>`. 3) Resolve base via `gh pr view --json baseRefName` or `git merge-base HEAD origin/main`. For commit ranges, DO NOT switch branches.

      If target is empty, emit `<abort>nothing to review</abort>`.

      List changed paths via `git diff --name-only <base>..<head>` / as given / `git diff --name-only HEAD`. Paths must be real on-disk, repo-relative.

      Output exactly (no preamble):

      TARGET: <DIFF|FILES|UNCOMMITTED> <args>
      PATHS: <comma-sep>
      LOC: <approx>
      FOCUS: <hint or general>
      CONTEXT: <one sentence>
      CHECKOUT: <branch you switched to, or 'unchanged' if no checkout happened>

  dispatch:
    type: llm
    thread: review
    allowed-tools: [agent]
    max-cost: 1.20
    prompt: |
      Dispatch the four lenses against the scope resolved above.

      Issue all four `agent` toolcalls in parallel; do not serialise. Pass the full scope output verbatim as each lens's `prompt` — they need PATHS / FOCUS / CONTEXT / CHECKOUT to scope their work.

        agent({ agent: "lens-correctness",  prompt: "<scope output verbatim>" })
        agent({ agent: "lens-security",     prompt: "<scope output verbatim>" })
        agent({ agent: "lens-performance",  prompt: "<scope output verbatim>" })
        agent({ agent: "lens-architecture", prompt: "<scope output verbatim>" })

      After all four sub-agents return, reply with EXACTLY: `LENSES_DONE: <count> returned`.

  synthesize:
    type: llm
    model: claude-opus-4-7
    effort: high
    thread: review
    allowed-tools: [read]
    max-cost: 0.60
    prompt: |
      Integrate the four lens results into a single ranked code review — emit it verbatim as your reply. Use exactly these headings:

      # Code Review

      ## Scope
      One paragraph aggregating the file paths cited across the findings below — name the touched packages/areas and the type of change (uncommitted diff, commit range, branch). If CHECKOUT is set to a branch, note it. If every lens reported `OK`, name the surface anyway.

      ## Critical
      ## High
      ## Medium
      ## Low

      Under each severity, one finding per item:
        - **path:line** — one-line claim.
          - Why: one sentence.
          - Fix: one sentence or short snippet.
          - Lens: correctness | security | performance | architecture (multiple if dedup'd).

      Rules:
        - DEDUPE. If two lenses flag the same issue, list once, combine the Lens field, take the higher severity.
        - PROMOTE. A correctness/security finding marked `medium` but cross-flagged by another lens may move to `high` — note `(cross-flagged)` after the claim.
        - DROP NOISE. Skip Low items that don't add signal (subjective style without evidence). Keep Low only if specific and actionable.
        - NO INVENTION. Don't add findings the lenses didn't raise. Don't soften severity without reason — if you down-rank, justify in Why.

      If every lens reported `OK:` (or returned no findings), replace the severity sections with:

      ## All clear
      One paragraph: what was reviewed, why no issues stood out, what the reviewers couldn't see (runtime, integration). One sentence on confidence.

      End with:

      ## Next steps
      Up to 3 concrete, ordered actions, one line each. If All clear, a single 'No follow-up required.' line.

  verify:
    type: llm
    thread: review
    retry: synthesize
    max-retries: 2
    allowed-tools: [read, grep]
    max-cost: 0.30
    prompt: |
      Evidence-quality gate for the code review. Judge it on its own merits.

      Check against three invariants:

      1. Every finding's `path:line` is verifiable — spot-check 2–3 random findings by reading the cited path and confirming the claim is anchored in real code (not hallucinated).

      2. Severity calibration is sane — no LOW for genuinely misleading claims, no CRITICAL for nitpicks; cross-flagged findings should be at HIGH or above.

      3. Output schema is followed — Scope section is present; severity sections are correctly ordered (Critical → High → Medium → Low) or replaced by 'All clear'; Next steps section is present and concise.

      If all three pass, reply with EXACTLY: `APPROVE`.

      If any fail, call the `abort` tool with reason `REJECT: <one-line summary of the worst violation>`.
