# work.yaml — triage → plan → implement → review → format → ci → commit.
#
# Replaces change + feature with one routed workflow. A triage step classifies
# the task (small / feature / blocked) via the `route` tool, and the wider
# pipeline shapes itself accordingly through shared thread context. After
# review, a small classifier (`needs_human`) decides whether the diff is
# contract-touching enough to warrant a human approver before CI.
#
# Demonstrates the routing primitives in one workflow:
#   - LLM-directed routing (`routes:` + ephemeral `route` tool) on
#     `triage` and `needs_human`.
#   - Human-step routing (`type: human` + `routes:`) on `approve`.
#
#   bun run swarm run work --input task="add a touch tool to @swarm/workspace"

name: work
goal: Triage a task and route it through the right plan/implement/review/ci pipeline.

inputs:
  task:
    type: string
    required: true
    description: The task to work on

defaults:
  provider: anthropic
  thread: dev

steps:
  triage:
    type: llm
    model: claude-opus-4-7
    allowed-tools: [read, grep, find]
    prompt: |
      Task: ${{ inputs.task }}.

      Classify with the `route` tool (call it exactly once on a response of its own):
        - small: ≤3 packages, no shared-contract changes (HandlerContext, executor internals, store schema, event envelope), ≤500 lines non-test
        - feature: multi-package OR shared contracts OR backed by a docs/proposals/*.md file
        - blocked: empty / ambiguous / shipped (check proposal frontmatter `status: shipped`)

      Read just enough to decide. Don't plan or implement; the downstream steps do that.
    routes:
      small:   {to: plan, label: "Small change"}
      feature: {to: plan, label: "Feature scope"}
      blocked: {to: exit, label: "Blocked"}

  plan:
    type: llm
    model: claude-opus-4-7
    allowed-tools: [read, grep, find, ls]
    prompt: |
      Read triage's classification from the prior message in this shared thread. Produce a numbered plan suited to that scope:

        1. Files to create/modify (full paths, grouped by package for feature-scope).
        2. Tests to add: file path, exact describe/test name, one assertion sentence.
        3. Public exports added/changed (symbol + package).
        4. Implementation notes per file (cite existing symbols + line numbers).
        5. For feature-scope: cross-package dependency order; same-PR doc obligations from AGENTS.md §1.

      If triage said `blocked`, abort with the reason it gave.

  implement:
    type: llm
    model: claude-sonnet-4-6
    allowed-tools: [read, write, edit, grep, bash]
    prompt: |
      Implement the plan. Stay inside the package(s) it names. After edits, `bun run --filter='@swarm/<pkg>' typecheck` per modified package; cap typecheck-fix at 5 cycles per package, then abort with `typecheck blocked: <top error>`.

      For every test in plan §2: grep the file for the describe/test name. If missing or weaker than promised, add it; re-typecheck.

      End with a PLAN_REALISED block listing files / tests / exports / doc_updates / skipped (one line each, with the status: created | modified | skipped | added | already-present).

  review:
    type: llm
    model: claude-sonnet-4-6
    retry: implement
    max-retries: 3
    allowed-tools: [read, grep, bash]
    prompt: |
      Judge `git diff HEAD` against PLAN_REALISED.

      Check:
        (a) Diff matches PLAN_REALISED — every claimed file/test/export is present, nothing else.
        (b) Every test in PLAN_REALISED is realised (file exists, name matches, assertion is non-trivial).
        (c) Bugs, type errors, security issues.
        (d) Scope creep beyond what the triage classification justifies.
        (e) Doc-state claims match reality — verify any prose asserting shipped / outstanding / on-paper against the filesystem.

      Reply `APPROVE: <one line>` on success. Abort with `REJECT: <one line>. fixes: <numbered list, 1-5 items>` on rejection.

  format:
    type: tool
    run: bun run format

  needs_human:
    type: llm
    model: claude-haiku-4-5
    allowed-tools: [read, bash]
    prompt: |
      Look at `git diff HEAD` and the triage classification in the shared thread. Use the `route` tool to decide whether a human should approve this before CI:

        - yes: shared contracts touched (HandlerContext, executor internals, store schema, event envelope), security-sensitive code, public API breaks, or triage said `feature`.
        - no: contained change, no contract surface, triage said `small`.

      Call route() exactly once on a response of its own.
    routes:
      no:  {to: ci,      label: "Auto-promote"}
      yes: {to: approve, label: "Needs human"}

  approve:
    type: human
    text: "Reviewer approved this change. Promote to CI?"
    routes:
      yes:   {to: ci,   label: "Promote"}
      no:    {to: exit, label: "Send back"}
      defer: {to: exit, label: "Defer"}

  ci:
    type: tool
    run: bun run ci
    max-retries: 5
    on:
      success: commit
      fail: fix

  fix:
    type: llm
    model: claude-sonnet-4-6
    allowed-tools: [read, write, edit, bash]
    max-cost: 0.30
    max-tokens: 800000
    prompt: |
      CI failed. Re-run `bun run ci` via the bash tool, read the failure log from its output, then make the minimal fix and stop — the next CI run is automatic. Don't disable tests, lower assertions, or relax linters.
    next: ci

  commit:
    type: llm
    model: claude-sonnet-4-6
    allowed-tools: [read, write, edit, bash]
    prompt: |
      Commit per AGENTS.md §Commit conventions. Fresh thread — read state via git.

      If `git status --short` is empty, emit `COMMITTED: no changes`.

      Else: `git add` explicit paths (group related files; multi-package work may warrant multiple commits, one per logical chunk), commit each with a HEREDOC message — `[<subsystem>] imperative subject ≤72 chars` then a body that stands alone. No --amend, no --no-verify, no Co-Authored-By. On hook failure, fix the root cause and create a NEW commit. Emit `COMMITTED: <short sha or sha list>`. Don't push.
