# doc-sync.yaml — keep a project's canonical agent doc (AGENTS.md / CLAUDE.md)
# in sync with the codebase, and APPLY the fixes behind an operator gate.
#
# Generic by design: discovers the canonical doc at the project root, audits
# whatever the repo actually contains, and edits in place via the built-in
# `edit` tool — no project-specific collector or apply script. Drop it into
# any repo's ~/.swarm/workflows or <project>/.swarm/workflows and run.
#
# Sibling of `drift` (which audits swarm's own architecture/spec/skill docs);
# doc-sync is the generic, single-doc one.
#
# Shape: audit (inspect each area → ground truth) → diff (doc claims vs ground
# truth → drift table) → propose (edit blocks) → verify
# (quality gate: drop weak rows, validate each edit's OLD/NEW against the doc)
# → signoff (HITL) → apply (edit tool). The llm steps share `thread: sync` so
# the canonical-doc path, ground-truth report, drift table, and proposed edits
# carry forward without copy-paste. The expensive fan-out lives in `audit`.
#
#   bun run swarm run doc-sync
#   bun run swarm run doc-sync --input scope="packages/ and docs/"

name: doc-sync
goal: Audit a project's codebase against its canonical AGENTS.md/CLAUDE.md, surface drift, and apply the fixes with operator signoff.
budget: 5.00
budget-policy: pause

inputs:
  scope:
    type: string
    default: ""
    description: Optional scope hint (e.g. "packages/ and docs/")

defaults:
  provider: anthropic
  model: claude-sonnet-4-6

steps:
  audit:
    type: llm
    thread: sync
    next: diff
    allowed-tools: [read, bash, grep, find, ls]
    max-cost: 1.50
    prompt: |
      Build a ground-truth summary of this codebase for the next step to diff against the canonical agent doc.

      Identify the canonical doc — check in order: AGENTS.md, then CLAUDE.md, at the project root. Follow symlinks; if both resolve to the same inode, name the AGENTS.md path. If neither exists, call `abort` with reason `no AGENTS.md or CLAUDE.md at project root`.

      Snapshot the layout: `git ls-files` (fall back to `find . -maxdepth 4 -type f` excluding node_modules/.git/dist/build/.cache/.swarm), top-level `ls -la`, and manifest files. Pick AT MOST 8 areas worth inspecting. Honour `${{ inputs.scope }}` if set.

      Inspect each area directly (read its key files, grep, ls) and write a structured summary per area in this exact shape:

        ## <area path>
        **purpose**: one sentence — what this area does.
        **key_files**: 3–7 most load-bearing files, one line each.
        **public_api**: what other code depends on; 'none' if internal-only.
        **conventions**: patterns evidenced by the files; no speculation.
        **surprises**: anything a docs reader would NOT expect; 'none' otherwise.

      Keep each area ≤350 words; cite file:line for non-obvious claims. Don't read everything — sample the load-bearing files per area.

      Assemble the ground-truth report as your final message:

        # Ground truth — <repo name from cwd>
        **Doc under audit:** <canonical doc path>
        ## Layout overview
        One paragraph on the top-level shape.
        ## Areas
        <each subagent's structured summary, verbatim>
        ## Cross-cutting observations
        Things spanning areas; omit if nothing crosses.

      Do NOT compare against the doc — that's the next step. If you find no auditable areas, call `abort` with reason `no auditable areas found`.

  diff:
    type: llm
    thread: sync
    next: propose
    allowed-tools: [read, grep]
    max-cost: 1.00
    prompt: |
      Cross-reference the canonical doc (path in the ground-truth report's `**Doc under audit:**` header) against the ground truth. Read the doc, then classify every claim it makes about codebase shape (stack, dependency direction, codebase map, commands, file layout, conventions):

        - OK — matches ground truth.
        - STALE — concrete claim contradicted by ground truth; cite doc:line + contradicting evidence.
        - MISSING — ground truth shows something significant the doc omits.

      Ignore claims that aren't filesystem-derivable. Every non-OK row MUST cite BOTH the doc location and the audit evidence. Do not fabricate.

      Emit a markdown table as your FINAL message, no preamble:

        | Severity | Kind | Doc location | Claim / gap | Evidence |
        |---|---|---|---|---|
        | CRITICAL | STALE | AGENTS.md:42 | 'web → server → store' | packages/web/src/lib/foo.ts imports @swarm/daemon |

      Severity: CRITICAL = misleading; HIGH = significant gap a reader would miss; MEDIUM = minor inconsistency; LOW = OK rows for traceability.

  propose:
    type: llm
    thread: sync
    next: verify
    allowed-tools: [read]
    max-cost: 1.00
    prompt: |
      Translate the drift table's non-OK rows into edit blocks for the canonical doc. The `Doc location` column names the file.

      For each STALE row: an edit replacing the verbatim current text with corrected text in the doc's tone.
      For each MISSING row: an edit whose OLD is the existing line/section header the new content follows, NEW being that anchor + newline + the new content.

      Rules:
        - OLD MUST be unique in the doc — expand with surrounding context until it is.
        - Preserve the doc's tone, casing, list style, markdown conventions.
        - PRESERVE unrelated content — touch only what a row flagged.
        - One block per row. Skip OK rows.

      Emit each block as your FINAL message, no preamble:

        ### Edit <n> — <doc path>
        OLD:
        ~~~
        <verbatim text to replace>
        ~~~
        NEW:
        ~~~
        <replacement text>
        ~~~

      For a row too ambiguous to edit safely, emit `### Edit <n> — SKIP — <why>` and omit OLD/NEW. If no edits apply, reply EXACTLY `no edits`.

  verify:
    type: llm
    thread: sync
    next: signoff
    allowed-tools: [read, grep]
    max-cost: 0.80
    prompt: |
      Quality gate over the drift rows and proposed edits. You DROP weak items rather than failing the run — the operator approves what survives.

      Rows: keep a non-OK row only if it cites BOTH a doc location AND audit evidence; spot-check 2–3 by re-reading the cited doc. Drop fabricated or miscalibrated rows.

      Edits: for each `### Edit` block, read the doc and confirm OLD appears EXACTLY once and NEW genuinely resolves the row while preserving tone. Drop any edit whose OLD is missing or non-unique, or that overreaches. SKIP blocks stay as-is.

      Emit your FINAL message: the surviving `### Edit` blocks verbatim, any SKIP blocks, then a one-line `## Dropped: <n> — <terse reasons>`. If nothing survives, reply EXACTLY: `no edits`.

  signoff:
    type: human
    text: "Verified drift report + proposed edits are ready above. Apply the edits, or keep the report only?"
    routes:
      apply:       {to: apply, label: "Apply"}
      report_only: {to: exit,  label: "Report only"}

  apply:
    type: llm
    thread: sync
    next: exit
    allowed-tools: [read, edit]
    max-cost: 0.40
    prompt: |
      Apply each surviving `### Edit` block (the verified set above) to the canonical doc using the `edit` tool — one call per block, OLD as `old_string`, NEW as `new_string`, verbatim. Skip SKIP blocks.

      If an `edit` fails because OLD is not found or not unique, call `abort` with reason `apply failed: edit <n> old_string not uniquely matched`. On success, emit a one-line summary: `applied <N>, skipped <M>`.
