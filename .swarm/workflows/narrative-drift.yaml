# narrative-drift.yaml — find rot in surfaces where drift is reasoning-heavy:
# per-skill SKILL.md vs the code each skill documents, STATUS.md "delivers
# today" claims vs current code, and proposal hygiene.
#
# Read-only by design. The collector is its own dedicated llm node so a
# goal-gate retry on `review` does NOT re-run the collect script. `collect`,
# `audit`, and `review` share `thread_id: audit` — the collector's bash
# tool result lives in the thread, and downstream nodes reason directly
# over that snapshot.
#
# `audit` then fans out N parallel `agent` toolcalls in ONE turn (the
# doc-sync.yaml pattern): one subagent per swarm-* SKILL.md, plus one for
# the claims + proposals pass. Each subagent's full file reads stay in its
# own context; only a structured ~350-word summary returns.
#
#   bun run swarm run narrative-drift
#   bun run swarm run narrative-drift --input="only swarm-author"
#
# Cadence: weekly. Findings are reasoning-heavy and would generate
# questionable auto-rewrites — the operator reviews and applies by hand.
# Pairs with structural-drift.yaml (literal cross-ref + apply tail) and
# rollup.yaml (weekly senior-engineer post-mortem consuming both).

name: narrative-drift
goal: Audit swarm-* SKILL.md files against the code they document, STATUS.md 'delivers today' claims against reality, and proposal hygiene; surface drift as a findings-only report.
label: narrative-drift
budget_usd: 4.50
budget_policy: warn
max_goal_gate_retries: 2

nodes:
  start: {type: start}

  collect:
    type: llm
    llm_provider: anthropic
    llm_model: claude-haiku-4-5
    thread_id: audit
    allowed_tools: [bash]
    max_cost_usd: 0.10
    prompt: |
      Run `bun .swarm/scripts/narrative-drift/collect.ts $ARGUMENTS` via the bash tool — once. Do not interpret, summarise, or reformat the JSON.

      If the script exits non-zero or returns malformed JSON, call the `abort` tool with reason `collector failed: <exit code or parse error>`.

      Otherwise reply with EXACTLY: `collected`.

  audit:
    type: llm
    llm_provider: anthropic
    llm_model: claude-sonnet-4-6
    thread_id: audit
    allowed_tools: [agent, read, grep, find]
    max_cost_usd: 2.50
    prompt: |
      Build a drift report by fanning out per-area subagents in parallel.

      The collector snapshot contains `skills[]` ({path, name, description, target_hint, lines, sha256_12} — swarm-* only), `status` and `readme` (each with delivers_today / does_not_deliver — STATUS.md preferred, README.md fallback if STATUS is empty), `proposals[]` ({file, title, status, maturity, last_reviewed}), `proposals_index` (verbatim docs/proposals/README.md). Trust those values verbatim.

      Fan-out plan:
        1. For each entry in `skills[]` (subject to $ARGUMENTS filter), dispatch ONE `agent` toolcall using SKILL TEMPLATE below.
        2. ALSO dispatch ONE agent for claims + proposals using CLAIMS TEMPLATE below.
        3. Issue all `agent` toolcalls in parallel; do not serialise.
        4. After all subagents return, consolidate their summaries into a single drift table — see TABLE SHAPE.

      SKILL TEMPLATE (substitute <SKILL.path>, <NAME>, <TARGET_HINT> per dispatch):

        Inspect the skill at <SKILL.path>. Cross-reference its claims against the code it documents.
        TARGET HINT (where to look first): <TARGET_HINT>

        Read-only. Produce a STRUCTURED summary in this exact shape — no prose preamble:

        ## skill:<NAME>
        **purpose**: 1 sentence — what this skill is supposed to teach.
        **findings**: bullet list of drift between SKILL.md and current code. Each item:
          - SEVERITY (CRITICAL | HIGH | MEDIUM | LOW): one-line claim
            cite (a) SKILL.md location (line or section) AND (b) code surface (file:line) — both required.
          'no findings' is a valid result if the skill is current.
        **stale_signals**: concrete signals the skill is stale (references to files that no longer exist, mentions of removed APIs, examples whose imports now resolve differently). 'none' if unsurprising.

        Constraints: ≤ 350 words. No speculation; cite file:line for every non-obvious claim.

      CLAIMS TEMPLATE (one-shot):

        Inspect the project's 'what swarm delivers today' claims and proposal hygiene.

        Read STATUS.md (preferred) or README.md (fallback) for `## What swarm delivers today` and `## What swarm does not deliver today`. Read docs/proposals/*.md frontmatter via the paths supplied in the orchestrator's snapshot.

        Read-only. Produce STRUCTURED summary — no prose preamble:

        ## claims+proposals
        **claims_findings**: bullet list of each 'delivers today' claim with one of:
          - BACKED: cite file:line of supporting code/tests.
          - UNBACKED: no obvious evidence; describe what would back it.
          - PARTIAL: partially shipped; describe the gap.
          Severity tag CRITICAL / HIGH / MEDIUM / LOW.
        **proposals_findings**:
          - status=shipped proposals whose capability is NOT in 'delivers today' — MEDIUM.
          - status=in-progress proposals whose prose contradicts the YAML frontmatter — MEDIUM.
          - any proposal absent from proposals_index — LOW.

        Constraints: ≤ 500 words. Cite file:line and exact frontmatter values.

      TABLE SHAPE — your final reply:

        # Narrative drift — <ISO date from snapshot.collected_at>

        | Severity | Source | SKILL.md / doc location | Code surface | Drift |
        |---|---|---|---|---|
        | CRITICAL | swarm-author | SKILL.md §6 (validator codes) | packages/core/src/engine/validator.ts:120 | E016 not in skill table |
        | MEDIUM | claims+proposals | STATUS.md:14 'workflow_resolution' | (no evidence found) | UNBACKED |

      Walk every subagent section ('## skill:<name>' and '## claims+proposals') and copy each finding into the table verbatim. Do not invent, drop, or paraphrase. Keep severity labels exactly as the subagents reported them.

      If no findings across all subagents, reply with EXACTLY: `no narrative drift detected`. If the snapshot has no skills and no claims (empty status / readme / proposals), call the `abort` tool with reason `collect output insufficient — nothing to audit`.

  review:
    type: llm
    llm_provider: anthropic
    llm_model: claude-sonnet-4-6
    thread_id: audit
    goal_gate: true
    retry_target: audit
    max_cost_usd: 0.80
    allowed_tools: [read]
    prompt: |
      Judge the drift table for completeness and evidence quality. You are the goal-gate: this run does not advance unless you APPROVE.

      Checklist:
        1. Every finding cites BOTH a SKILL.md / doc location AND a code surface (or 'no evidence found' for UNBACKED claims).
        2. No fabricated claims — spot-check 2–3 findings by re-reading the relevant SKILL.md or doc.
        3. Coverage looks reasonable — every skill referenced in the snapshot has at least one row attributable to it OR an explicit 'no findings' note. Wholly silent skills are a red flag.
        4. Severity calibration is sane (no LOW for genuinely misleading claims; no CRITICAL for nitpicks).

      If the table passes, reply with EXACTLY one line: `APPROVE`.

      If it fails, call the `abort` tool with reason `REJECT: <one-line reason>`.

  done: {type: exit}

edges:
  - {from: start, to: collect}
  - {from: collect, to: done, outcome: fail}
  - {from: collect, to: audit}
  - {from: audit, to: done, outcome: fail}
  - {from: audit, to: review}
  - {from: review, to: done}
