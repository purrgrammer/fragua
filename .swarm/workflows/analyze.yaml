# analyze.yaml — mine recent swarm runs for cost / confusion / redundancy patterns.
#
# Loop A from the meta-evaluation design: discovery only. A single llm
# runs `.swarm/scripts/analyze/collect.ts` via the bash tool to get a JSON
# snapshot of recent runs, then synthesises evidence-backed hypotheses in
# its own reply. Does NOT apply changes — that lives in a separate optimize
# workflow with an eval gate.
#
# Defaults: --since-days 7 --limit 200. Picks up low-traffic drift
# workflows that run 1–2×/week; capped so cost stays bounded on
# high-traffic projects. Override via $ARGUMENTS as needed.
#
#   bun run swarm run analyze                                     # last 7 days, ≤200 runs
#   bun run swarm run analyze --input="--workflow change"         # filter to one workflow
#   bun run swarm run analyze --input="--since-days 30"           # widen the window
#   bun run swarm run analyze --input="--limit 50"                # tighten the cap

name: analyze
goal: Mine recent swarm runs for cost, confusion, and redundancy patterns; emit ranked, evidence-backed hypotheses for workflow improvements.
label: analyze
budget_usd: 1.50
model_stylesheet: "* { llm_provider: anthropic; llm_model: claude-sonnet-4-6; }"

nodes:
  start: {type: start}

  analyze:
    type: llm
    allowed_tools: [bash, read]
    reasoning_effort: high
    max_cost_usd: 1.20
    prompt: |
      Audit recent swarm runs and emit ranked, evidence-backed improvement hypotheses.

      First: run `bun .swarm/scripts/analyze/collect.ts $ARGUMENTS` via the bash tool and read its JSON report. Fields: `totals`, `by_workflow[]` (aggregates + `node_profiles[]`), `runs[]` (per-run records + `per_node[]`). Trust its numbers; quote only them; never invent fields.

      Field caveats: `partial`/`partial_in_runs` figures are lower bounds (node still running). `dispatch_seconds` = wall − llm − tool (setup/queue/network, not compute). `node_type` of `tool`/`start`/`exit` is non-LLM — zero tokens is expected, not a gap.

      Emit a markdown report as your FINAL message verbatim — no file writes, no preamble, no postscript. Headings, exactly:

      # Swarm Analysis — <ISO date from collected_at>

      ## Scope
      One paragraph: total runs, distinct workflows, time window, sum cost. Note workflows with <3 runs are listed but not analysed.

      ## Per-workflow findings
      Per workflow with n_runs >= 3, a `### <workflow>` subsection:
      **Health.** One paragraph: status mix, cost p50/p90, token p50/p90, mean duration, models.
      **Hypotheses.** Up to 5, ranked by impact * confidence. Each a numbered item with labelled lines — **Claim:** the pattern in one sentence. **Evidence:** specific run_ids and >=2 numbers from the JSON. **Proposed change:** one concrete edit (prompt reword, max_retries, model swap, context_files, node split, tool removal), naming the .yaml file and node. **Confidence:** low|medium|high + one sentence why. **Estimated impact:** cost delta $/%, or token delta, or reliability with a number.
      Zero confusion signals (no aborts/steers/retargets/halts) + tight cost variance → 'no actionable hypotheses; workflow appears healthy'. Don't manufacture findings.

      ## Workflows below sample threshold
      <workflow> (n=N): not analysed. One line each.

      ## Cross-workflow observations
      Only if something holds across workflows; else omit.

      Rules: cite numbers not vibes; one run = low confidence, probably skip; a wanted-but-absent signal goes under a final '## Signals not collected'.

  done: {type: exit}

edges:
  - {from: start, to: analyze}
  - {from: analyze, to: done, outcome: fail}
  - {from: analyze, to: done}
