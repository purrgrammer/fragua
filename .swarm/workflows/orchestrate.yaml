# orchestrate.yaml — decompose a task, dispatch to specialist sub-agents.
#
# Single orchestrator step with `agent` in its tool pool. The model sees
# the discovered sub-agent catalog in its system prompt (rendered iff
# `agent` is allowed) and decides per sub-task whether to spawn a named
# profile or an ad-hoc agent (passing `system_prompt` + `allowed_tools`
# inline). Parallel dispatch is implicit — pi-agent-core fires concurrent
# `agent` toolcalls when issued in one assistant message.
#
#   bun run swarm run orchestrate --input task="your task here"

name: orchestrate
goal: Decompose a task, dispatch to named or ad-hoc sub-agents, synthesize.
budget: 5.00
budget-policy: stop

inputs:
  task:
    type: string
    required: true
    description: The task to decompose and orchestrate

defaults:
  provider: anthropic
  model: claude-opus-4-7

steps:
  orchestrate:
    type: llm
    thread: orchestrate
    allowed-tools: [read, write, edit, bash, grep, find, ls, agent]
    max-cost: 3.00
    timeout-minutes: 90
    prompt: |
      Task (authoritative): ${{ inputs.task }}.

      Decompose into 2–5 sub-tasks (one concern each), then delegate via the `agent` tool. Don't solve.

      For each sub-task:
      - Named profile fits → `agent({ agent: "<name>", prompt: "<brief>" })`. The profile carries its own tool pool.
      - Otherwise ad-hoc → `agent({ name: "<label>", system_prompt: "<role>", prompt: "<brief>" })`. Sub-agents inherit THIS step's pool by default (minus `agent` — no nesting). Pass `allowed_tools` only to NARROW (e.g. `["read","grep"]` for an analyse-only task).

      Cap concurrent `agent` calls at 2 — issue at most 2 in any one assistant message; queue the rest until one returns. Heavy fan-out (5+ parallel sub-agents producing 100s of tool calls each) blows past the codergen handler watchdog before synthesis can run; serial pairs keep tail latency bounded.

      Briefs carry only the slice needed; cite paths, don't dump.

      Dispatch sub-tasks via `agent` tool calls. When all sub-agents have returned, emit a one-line confirmation (e.g. "DISPATCH_COMPLETE: <N> sub-agents returned") and stop — the downstream `synthesize` step produces the final user-facing answer.

      If a sub-agent aborts, narrow and re-spawn once, or proceed with a marked gap. If the task can't be decomposed, call the `abort` tool with reason `not decomposable: <reason>`.

  synthesize:
    type: llm
    thread: orchestrate
    allowed-tools: []
    max-cost: 1.50
    prompt: |
      Synthesize a final answer from the sub-agent results. Reconcile conflicts; write ONE unified answer that addresses ${{ inputs.task }}. Don't list reports — produce a unified result.
